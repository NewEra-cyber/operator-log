<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <title>OPERATOR LOG // TACTICAL SUITE PRO</title>
  <meta name="theme-color" content="#0d1115" />
  <meta name="description" content="Tactical workout, nutrition and physique tracker. Offline-first." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OP LOG" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    /* ============================================================
   TOKENS
   ============================================================ */
    :root {
      --bg: #050505;
      /* Deeper black */
      --card: #0f0f12;
      /* Dark charcoal */
      --card-2: #0a0a0c;
      --border: #2a2a2a;
      /* Darker borders */
      --orange: #ff2a2a;
      /* Primary Neon Red */
      --green: #3fb27f;
      --red: #ff2a2a;
      --cyan: #ff6b6b;
      /* Soft red/cyan replacement */
      --txt: #ffffff;
      --muted: #8a8a8a;
      --dim: #555555;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --head: 'Chakra Petch', system-ui, sans-serif;
      --body: 'Inter', system-ui, -apple-system, sans-serif;
      --nav-h: 58px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: var(--body);
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));
      background-image:
        radial-gradient(circle at 15% -5%, rgba(56, 189, 248, .07), transparent 42%),
        radial-gradient(circle at 95% 8%, rgba(240, 160, 48, .08), transparent 40%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--head);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 0;
      line-height: 1.2
    }

    button {
      font-family: inherit;
      cursor: pointer
    }

    input,
    select,
    textarea {
      font-family: inherit
    }

    input[type=number] {
      -moz-appearance: textfield
    }

    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums
    }

    .dim {
      color: var(--muted)
    }

    .small {
      font-size: 11px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .between {
      justify-content: space-between
    }

    /* ============================================================
   HEADER + HAZARD
   ============================================================ */
    header.app-head {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(13, 17, 21, .94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .hazard {
      height: 6px;
      background: repeating-linear-gradient(45deg, var(--orange) 0 10px, #0d1115 10px 20px);
      opacity: .9;
    }

    .head-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 14px;
      max-width: 820px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      border: 1.5px solid var(--orange);
      display: grid;
      place-items: center;
      color: var(--orange);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      position: relative;
    }

    .brand-mark::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(240, 160, 48, .35);
    }

    .brand h1 {
      font-size: 13px;
      letter-spacing: .13em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .brand small {
      display: block;
      font-family: var(--mono);
      font-size: 8.5px;
      color: var(--muted);
      letter-spacing: .16em;
      font-weight: 400;
      margin-top: 1px;
    }

    .head-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--green);
      border: 1px solid rgba(63, 178, 127, .32);
      background: rgba(63, 178, 127, .08);
      padding: 4px 8px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2.2s infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    /* ============================================================
   LAYOUT
   ============================================================ */
    main#view {
      display: block
    }

    .pad {
      padding: 12px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 820px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px;
      position: relative;
      /* ADD THIS GLOW */
      box-shadow: 0 4px 20px rgba(255, 42, 42, 0.05);
    }

    .kicker {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ============================================================
   DAY STRIP
   ============================================================ */
    .day-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .day-strip::-webkit-scrollbar {
      display: none
    }

    .day-pill {
      flex: 0 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 7px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      color: var(--muted);
      font-family: var(--head);
      letter-spacing: .09em;
      transition: .15s;
    }

    .day-pill b {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700
    }

    .day-pill span {
      font-size: 8.5px;
      opacity: .85
    }

    .day-pill.on {
      border-color: var(--orange);
      color: var(--orange);
      background: rgba(240, 160, 48, .1);
      box-shadow: inset 0 0 0 1px rgba(240, 160, 48, .22);
    }

    /* ============================================================
   MISSION HEADER CARD
   ============================================================ */
    .day-title {
      font-size: 19px;
      color: #fff;
      margin-top: 2px
    }

    .focus {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--cyan);
      letter-spacing: .12em;
      margin-top: 3px
    }

    .progress {
      height: 5px;
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin: 11px 0 7px;
    }

    .progress i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--orange), #ffd27a);
      transition: width .3s ease;
    }

    /* ============================================================
   EXERCISE CARD
   ============================================================ */
    .ex-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 14px 12px;
      position: relative;
      margin-top: 4px;
      /* ADD THIS GLOW */
      box-shadow: 0 4px 20px rgba(255, 42, 42, 0.05);
      transition: all 0.3s ease;
    }

    .ex-card:active {
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.3);
      border-color: var(--orange);
    }

    .ex-card::before,
    .ex-card::after {
      content: '';
      position: absolute;
      width: 13px;
      height: 13px;
      border: 1.5px solid var(--orange);
      opacity: .72;
      pointer-events: none;
    }

    .ex-card::before {
      top: -1px;
      left: -1px;
      border-right: 0;
      border-bottom: 0
    }

    .ex-card::after {
      bottom: -1px;
      right: -1px;
      border-left: 0;
      border-top: 0
    }

    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px
    }

    .ex-id {
      min-width: 0;
      flex: 1
    }

    .ex-id h3 {
      font-size: 13.5px;
      color: #fff;
      letter-spacing: .05em;
      line-height: 1.25
    }

    .ex-meta {
      font-size: 9.5px;
      color: var(--muted);
      letter-spacing: .09em;
      margin-top: 3px
    }

    .ex-target {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      flex: 0 0 auto;
    }

    .ex-target span {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--muted);
      letter-spacing: .16em
    }

    .ex-target em {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--dim);
      font-style: normal;
      letter-spacing: .14em
    }

    .load-in {
      width: 62px;
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--orange);
      font-size: 15px;
      font-weight: 700;
      text-align: right;
      padding: 3px 6px;
      outline: none;
    }

    .load-in:focus {
      border-color: var(--orange)
    }

    .best-badge {
      margin-top: 9px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .1em;
      color: var(--cyan);
      background: rgba(56, 189, 248, .08);
      border-left: 2px solid var(--cyan);
      padding: 5px 8px;
      border-radius: 2px;
    }

    .best-badge b {
      color: #fff
    }

    .cues {
      margin: 9px 0 10px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
      border-left: 2px solid var(--border);
      padding-left: 9px;
    }

    .tools {
      display: flex;
      gap: 10px;
      align-items: stretch;
      flex-wrap: wrap
    }

    .lbl {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .16em;
      color: var(--muted);
      display: block;
      margin-bottom: 5px
    }

    .plate-box {
      flex: 1 1 180px;
      min-width: 0
    }

    .plates {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
      min-height: 20px
    }

    .plate {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      padding: 2.5px 5px;
      border-radius: 2px;
      color: #0d1115;
      line-height: 1;
    }

    .plate[data-w="25"] {
      background: #e5534b;
      color: #fff
    }

    .plate[data-w="20"] {
      background: #38bdf8;
      color: #06202b
    }

    .plate[data-w="15"] {
      background: #f0a030;
      color: #241503
    }

    .plate[data-w="10"] {
      background: #3fb27f;
      color: #04231a
    }

    .plate[data-w="5"] {
      background: #dfe7ef;
      color: #111
    }

    .plate[data-w="2.5"] {
      background: #5a6b7d;
      color: #fff
    }

    .plate[data-w="1.25"] {
      background: #8b9aab;
      color: #111
    }

    .plate-total {
      font-size: 9px;
      color: var(--muted);
      margin-left: 3px
    }

    .rir-box {
      flex: 0 0 auto
    }

    .rir-sel {
      display: flex;
      gap: 3px
    }

    .rir-sel button {
      width: 30px;
      height: 25px;
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      border-radius: 2px;
      transition: .13s;
    }

    .rir-sel button.on {
      border-color: var(--orange);
      color: var(--orange);
      background: rgba(240, 160, 48, .14);
      box-shadow: 0 0 10px rgba(240, 160, 48, .2);
    }

    /* sets */
    .sets {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .set-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px
    }

    .set-btn {
      width: 42px;
      height: 38px;
      border-radius: 3px;
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      transition: .14s;
      display: grid;
      place-items: center;
    }

    .set-btn:active {
      transform: scale(.94)
    }

    .set-item.done .set-btn {
      border-color: var(--green);
      color: #0d1115;
      background: var(--green);
      box-shadow: 0 0 12px rgba(63, 178, 127, .35);
    }

    .reps-in {
      width: 42px;
      background: transparent;
      border: 1px solid transparent;
      border-bottom: 1px solid var(--border);
      color: var(--txt);
      font-size: 11px;
      text-align: center;
      padding: 2px 0;
      outline: none;
    }

    .reps-in:focus {
      border-bottom-color: var(--orange);
      color: var(--orange)
    }

    .overload {
      margin-top: 11px;
      display: flex;
      gap: 7px;
      align-items: flex-start;
      background: rgba(240, 160, 48, .1);
      border: 1px solid rgba(240, 160, 48, .45);
      color: var(--orange);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .06em;
      padding: 8px 10px;
      border-radius: 2px;
      line-height: 1.5;
    }

    .overload b {
      color: #fff
    }

    /* ============================================================
   REST TIMER
   ============================================================ */
    #restBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
      z-index: 55;
      transform: translateY(140%);
      transition: transform .28s cubic-bezier(.2, .9, .3, 1);
      padding: 0 10px 8px;
      pointer-events: none;
    }

    #restBar.show {
      transform: translateY(0);
      pointer-events: auto
    }

    .rest-inner {
      max-width: 820px;
      margin: 0 auto;
      background: linear-gradient(180deg, #1b232b, #131920);
      border: 1px solid var(--orange);
      border-radius: 5px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .6), 0 0 0 1px rgba(240, 160, 48, .18);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .rest-clock {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: .03em;
      min-width: 74px;
      text-shadow: 0 0 14px rgba(240, 160, 48, .45);
    }

    .rest-presets {
      display: flex;
      gap: 4px;
      flex: 1;
      flex-wrap: wrap
    }

    .rest-presets button {
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9.5px;
      padding: 5px 7px;
      border-radius: 2px;
    }

    .rest-presets button.on {
      border-color: var(--orange);
      color: var(--orange)
    }

    .rest-skip {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
      font-family: var(--mono);
      font-size: 9.5px;
      padding: 6px 9px;
      border-radius: 2px;
      letter-spacing: .1em;
    }

    #restBar.ringing .rest-inner {
      animation: ring .6s ease-in-out infinite
    }

    @keyframes ring {

      0%,
      100% {
        border-color: var(--orange)
      }

      50% {
        border-color: #fff;
        box-shadow: 0 0 26px rgba(240, 160, 48, .7)
      }
    }

    /* ============================================================
   BOTTOM NAV
   ============================================================ */
    nav#tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(13, 17, 21, .97);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }

    nav#tabs button {
      background: none;
      border: 0;
      color: var(--muted);
      font-family: var(--head);
      font-size: 8.5px;
      letter-spacing: .09em;
      padding: 8px 2px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-transform: uppercase;
      transition: .15s;
      position: relative;
    }

    nav#tabs button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    nav#tabs button.active {
      color: var(--orange)
    }

    nav#tabs button.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 22%;
      right: 22%;
      height: 2px;
      background: var(--orange);
      box-shadow: 0 0 10px var(--orange);
    }

    /* ============================================================
   REFUEL
   ============================================================ */
    .date-nav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 7px;
      align-items: center;
    }

    .date-nav button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--txt);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
      padding: 10px 10px;
      border-radius: 3px;
    }

    .date-nav button:active {
      border-color: var(--orange);
      color: var(--orange)
    }

    .date-nav input[type=date] {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--txt);
      font-family: var(--mono);
      font-size: 11px;
      padding: 9px 8px;
      border-radius: 3px;
      width: 100%;
      text-align: center;
      outline: none;
      color-scheme: dark;
    }

    .date-nav input[type=date]:focus {
      border-color: var(--orange)
    }

    .ring-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: center;
      padding: 6px 0
    }

    .ring-box {
      position: relative;
      width: 150px;
      height: 150px;
      flex: 0 0 150px
    }

    .ring {
      width: 150px;
      height: 150px;
      transform: rotate(-90deg)
    }

    .ring-bg {
      fill: none;
      stroke: #1b242d;
      stroke-width: 9
    }

    .ring-fg {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 9;
      stroke-linecap: round;
      transition: stroke-dashoffset .6s cubic-bezier(.2, .9, .3, 1);
      filter: drop-shadow(0 0 6px rgba(240, 160, 48, .5));
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .ring-center .big {
      font-family: var(--mono);
      font-size: 30px;
      font-weight: 700;
      color: #fff;
      line-height: 1
    }

    .ring-center .of {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .13em;
      margin-top: 2px
    }

    .ring-center .kcal {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--cyan);
      margin-top: 6px
    }

    .ring-stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 0
    }

    .stat-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .06em;
      border-bottom: 1px dashed #1d2731;
      padding-bottom: 5px
    }

    .stat-line b {
      color: var(--txt);
      font-weight: 700
    }

    .stat-line b.ok {
      color: var(--green)
    }

    .stat-line b.bad {
      color: var(--red)
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px
    }

    .mcell {
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .mcell .d {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--dim);
      letter-spacing: .08em
    }

    .mcell .v {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted)
    }

    .mcell.hit {
      border-color: var(--green);
      background: rgba(63, 178, 127, .11)
    }

    .mcell.hit .v {
      color: var(--green)
    }

    .mcell.today {
      box-shadow: inset 0 0 0 1px var(--orange)
    }

    .mcell.today .d {
      color: var(--orange)
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px
    }

    .qbtn {
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 9px 10px;

      align-items: center;

      text-align: left;

    .qbtn:active {
      border-color: var(--orange);
      background: rgba(240, 160, 48, .1)
    }

    .qbtn .qn {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.25
    }

    .qbtn .qp {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      flex: 0 0 auto
    }

    .meal {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dashed #1d2731;
    }

    .meal:last-child {
      border-bottom: 0
    }

    .meal .mn {
      font-size: 12px;
      font-weight: 500;
      color: #fff
    }

    .meal .mb {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.4
    }

    .meal .mv {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green);
      white-space: nowrap;
      text-align: right
    }

    .meal .mv em {
      display: block;
      font-style: normal;
      color: var(--cyan);
      font-size: 9.5px
    }

    .del {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dim);
      width: 24px;
      height: 24px;
      border-radius: 2px;
      font-size: 12px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .del:active {
      border-color: var(--red);
      color: var(--red)
    }

    .scan-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(240, 160, 48, .16), rgba(240, 160, 48, .05));
      border: 1px solid var(--orange);
      color: var(--orange);
      font-family: var(--head);
      font-size: 12px;
      letter-spacing: .14em;
      padding: 13px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .scan-btn:active {
      background: rgba(240, 160, 48, .28)
    }

    .scan-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8
    }

    .scan-result {
      border-radius: 4px;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid
    }

    .scan-result.ok {
      border-color: var(--green);
      background: rgba(63, 178, 127, .09)
    }

    .scan-result.bad {
      border-color: var(--red);
      background: rgba(229, 83, 75, .09)
    }

    .scan-result.load {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, .07)
    }

    .scan-result h4 {
      font-size: 12px;
      margin-bottom: 5px
    }

    .scan-result.ok h4 {
      color: var(--green)
    }

    .scan-result.bad h4 {
      color: var(--red)
    }

    .scan-result.load h4 {
      color: var(--cyan)
    }

    .scan-macros {
      display: flex;
      gap: 14px;
      margin: 8px 0;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700
    }

    .scan-macros .p {
      color: var(--green)
    }

    .scan-macros .c {
      color: var(--cyan)
    }

    .confirm-btn {
      width: 100%;
      margin-top: 9px;
      background: var(--green);
      border: 0;
      color: #07130e;
      font-family: var(--head);
      font-size: 12px;
      letter-spacing: .14em;
      font-weight: 700;
      padding: 12px;
      border-radius: 3px;
    }

    .confirm-btn:active {
      filter: brightness(.88)
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(56, 189, 248, .3);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: inline-block;
      vertical-align: -3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .manual {
      display: grid;
      grid-template-columns: 1fr 56px 62px auto;
      gap: 6px
    }

    .manual input {
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--txt);
      font-size: 11.5px;
      padding: 9px 8px;
      border-radius: 3px;
      outline: none;
      min-width: 0;
    }

    .manual input:focus {
      border-color: var(--orange)
    }

    .manual button {
      background: #0a0e12;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 10px;
      padding: 0 10px;
      border-radius: 3px;
      letter-spacing: .08em;
    }

    /* ============================================================
   VAULT
   ============================================================ */
    .ms-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 11px;
      margin-top: 4px
    }

    .ms-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 9px
    }

    .ms-head h3 {
      font-size: 12px;
      color: #fff
    }

    .ms-head span {
      font-family: var(--mono);
      font-size: 8.5px;
      color: var(--muted);
      letter-spacing: .14em
    }

    .ms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px
    }

    .photo-slot {
      aspect-ratio: 3/4;
      background: #0a0e12;
      border: 1px dashed var(--border);
      border-radius: 3px;
      overflow: hidden;
      padding: 0;
      display: grid;
      place-items: center;
      position: relative;
    }

    .photo-slot:active {
      border-color: var(--orange)
    }

    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .ph-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--dim)
    }

    .ph-empty span {
      font-size: 18px;
      line-height: 1
    }

    .ph-empty em {
      font-style: normal;
      font-family: var(--mono);
      font-size: 7.5px;
      letter-spacing: .14em;
      color: var(--muted);
    }

    .cmp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 11px
    }

    .cmp-slot {
      aspect-ratio: 3/4;
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
    }

    .cmp-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .cmp-slot .tag {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 17, 21, .85);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .12em;
      padding: 4px;
      text-align: center;
      color: var(--orange);
    }

    .sel-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 10px
    }

    .sel-row select {
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--txt);
      font-family: var(--mono);
      font-size: 10px;
      padding: 9px 6px;
      border-radius: 3px;
      outline: none;
      width: 100%;
    }

    .sel-row select:focus {
      border-color: var(--orange)
    }

    /* ============================================================
   BLUEPRINT DECK
   ============================================================ */
    .bp-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px
    }

    .bp-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0;
      overflow: hidden;
      position: relative;
      display: block;
      text-align: left;
      transition: .15s;
    }

    .bp-card:active {
      border-color: var(--orange);
      transform: scale(.98)
    }

    .bp-img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3/4;
      object-fit: cover;
      object-position: top;
    }

    .bp-label {
      display: block;
      font-family: var(--head);
      font-size: 9px;
      letter-spacing: .1em;
      color: var(--muted);
      padding: 7px 9px;
      border-top: 1px solid var(--border);
      text-transform: uppercase;
      text-align: center;
    }

    .bp-card.full-width {
      grid-column: 1 / -1;
    }

    .bp-card.full-width .bp-img {
      aspect-ratio: auto;
      max-height: 300px;
      object-fit: cover;
      object-position: center;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(5, 8, 11, .97);
      display: none;
      flex-direction: column;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .lightbox.open {
      display: flex
    }

    .lb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      padding-top: calc(12px + env(safe-area-inset-top));
    }

    .lb-bar span {
      font-size: 10px;
      letter-spacing: .14em;
      color: var(--orange)
    }

    .lb-btns {
      display: flex;
      gap: 5px
    }

    .lb-btns button {
      width: 34px;
      height: 34px;
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--txt);
      border-radius: 3px;
      font-size: 14px;
      line-height: 1;
      display: grid;
      place-items: center;
    }

    .lb-btns button:active {
      border-color: var(--orange);
      color: var(--orange)
    }

    .lb-stage {
      flex: 1;
      overflow: hidden;
      position: relative;
      touch-action: none;
      display: grid;
      place-items: center;
      cursor: grab;
    }

    .lb-stage:active {
      cursor: grabbing
    }

    .lb-content {
      width: min(92vw, 600px);
      max-height: 100%;
      transform-origin: center center;
      transition: transform .12s ease-out;
      will-change: transform;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lb-content img {
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .lb-hint {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: .14em;
      color: var(--dim);
      pointer-events: none;
    }

    /* ============================================================
   SYSTEM
   ============================================================ */
    .sys-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px dashed #1d2731;
      font-size: 12px;
    }

    .sys-row:last-child {
      border-bottom: 0
    }

    .sys-row .v {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--orange)
    }

    .act-btn {
      width: 100%;
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--txt);
      font-family: var(--head);
      font-size: 11px;
      letter-spacing: .13em;
      padding: 13px;
      border-radius: 3px;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .act-btn:active {
      border-color: var(--orange);
      color: var(--orange)
    }

    .act-btn.danger {
      border-color: rgba(229, 83, 75, .5);
      color: var(--red)
    }

    .act-btn.primary {
      border-color: var(--cyan);
      color: var(--cyan)
    }

    /* ============================================================
   TOAST
   ============================================================ */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + 86px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      z-index: 300;
      background: #1b232b;
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      color: var(--txt);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .08em;
      padding: 10px 16px;
      border-radius: 3px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      max-width: 88vw;
      text-align: center;
      box-shadow: 0 8px 26px rgba(0, 0, 0, .65);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .toast.green {
      border-left-color: var(--green);
      color: var(--green)
    }

    .toast.red {
      border-left-color: var(--red);
      color: var(--red)
    }

    .toast.cyan {
      border-left-color: var(--cyan);
      color: var(--cyan)
    }

    @media(min-width:640px) {
      .quick-grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .bp-grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .ms-grid {
        grid-template-columns: repeat(3, 1fr)
      }
    }
  </style>
</head>

      /* ---------------------------------------------------------------------------

      const DB_KEY = "operatorlog.db.v3";
      const LEGACY_KEYS = [
        "operatorlog.db.v2",
        "operatorlog.db.v1",
        "operatorlog.db",

      function blankDB() {
        return {
          version: 3,
          created: Date.now(),
          settings: { proteinTarget: 105, operator: "OPERATOR" },
          logs: {},      // "YYYY-MM-DD" -> { meals: [ {id,name,p,cal,breakdown,at} ] }
          workouts: {},  // "dayKey::YYYY-MM-DD" -> { ex: { exId: {sets:[],reps:[],rir,weight} } }
          history: {},   // exId -> { weight, reps, date }
          photos: {}     // "w0" -> { front, side, back }
        };
      }

      function migrate(raw) {
        const db = blankDB();
        if (!raw || typeof raw !== "object") return db;

        /* ---- settings ---- */
        const s = raw.settings || raw.config || raw.prefs || {};
        db.settings.proteinTarget = num(s.proteinTarget != null ? s.proteinTarget : raw.proteinTarget, 105) || 105;
        db.settings.operator = s.operator || s.name || "OPERATOR";
        if (raw.proteinTarget && !s.proteinTarget) db.settings.proteinTarget = num(raw.proteinTarget, 105) || 105;

        /* ---- nutrition logs ---- */
        const rawLogs = raw.logs || raw.nutrition || raw.meals || raw.food || raw.diary || {};
        if (Array.isArray(rawLogs)) {
          db.logs[ymd()] = { meals: normaliseMeals(rawLogs) };
        } else if (rawLogs && typeof rawLogs === "object") {
          Object.keys(rawLogs).forEach((k) => {
            const v = rawLogs[k];
            if (Array.isArray(v)) db.logs[k] = { meals: normaliseMeals(v) };
            else if (v && typeof v === "object") db.logs[k] = { meals: normaliseMeals(v.meals || v.items || []) };
          });
        }

        /* ---- workouts ---- */
        const rawW = raw.workouts || raw.sessions || raw.training || raw.exercises || {};
        if (rawW && typeof rawW === "object") {
          Object.keys(rawW).forEach((k) => {
            const v = rawW[k] || {};
            const ex = v.ex || v.exercises || v.data || {};
            db.workouts[k] = { ex: (ex && typeof ex === "object") ? ex : {} };
          });
        }

        /* ---- history / PRs ---- */
        const rawH = raw.history || raw.bests || raw.prs || raw.records || {};
        if (rawH && typeof rawH === "object") {
          Object.keys(rawH).forEach((k) => {
            const v = rawH[k];
            if (v == null) return;
            if (typeof v === "number") {
              db.history[k] = { weight: v, reps: null, date: null };
            } else if (typeof v === "object") {
              db.history[k] = {
                weight: num(v.weight != null ? v.weight : v.w, 0),
                reps: v.reps != null ? num(v.reps, null) : null,
                date: v.date || v.at || null
              };
            }
          });
        }

        /* ---- photos ---- */
        const rawP = raw.photos || raw.vault || raw.milestones || raw.progress || {};
        if (rawP && typeof rawP === "object") {
          Object.keys(rawP).forEach((k) => {
            const v = rawP[k];
            if (!v || typeof v !== "object") return;
            db.photos[k] = {
              front: v.front || v.f || null,
              side: v.side || v.s || null,
              back: v.back || v.b || null
            };
          });
        }

        db.version = 3;
        return db;
      }

      function normaliseMeals(arr) {
        if (!Array.isArray(arr)) return [];
        return arr.map((m) => ({
          id: m.id || uid(),
          name: String(m.name || m.title || "Meal").slice(0, 90),
          p: num(m.p != null ? m.p : m.protein, 0),
          cal: num(m.cal != null ? m.cal : (m.kcal != null ? m.kcal : m.calories), 0),
          breakdown: String(m.breakdown || m.notes || "").slice(0, 240),
          img: m.img || m.image || null, // <--- ADD THIS
          at: m.at || m.time || Date.now()
        }));
      }

      function getDB() {
        let raw = null;
        const keys = [DB_KEY].concat(LEGACY_KEYS);
        for (let i = 0; i < keys.length; i++) {
          try {
            const v = localStorage.getItem(keys[i]);
            if (v && v !== "undefined" && v !== "null") { raw = v; break; }
          } catch (e) { /* storage blocked */ }
        }
        if (!raw) return blankDB();
        try {
          return migrate(JSON.parse(raw));
        } catch (e) {
          console.warn("[OPLOG] DB parse failed — starting fresh.", e);
          return blankDB();
        }
      }

      function saveDB(db) {
        try {
          localStorage.setItem(DB_KEY, JSON.stringify(db));
          return true;
        } catch (e) {
          console.error("[OPLOG] save failed", e);
          toast("STORAGE FULL — EXPORT & PURGE PHOTOS", "red");
          return false;

      function getSession(db, dayKey, dateKey) {
        const k = dayKey + "::" + dateKey;
        if (!db.workouts[k] || typeof db.workouts[k] !== "object") db.workouts[k] = { ex: {} };
        if (!db.workouts[k].ex || typeof db.workouts[k].ex !== "object") db.workouts[k].ex = {};
        return db.workouts[k];
      }

      function getExState(session, ex) {
        let s = session.ex[ex.id];
        if (!s || typeof s !== "object") {
          s = { sets: [], reps: [], rir: 2, weight: ex.weight };
          session.ex[ex.id] = s;
        }
        if (!Array.isArray(s.sets)) s.sets = [];
        if (!Array.isArray(s.reps)) s.reps = [];
        while (s.sets.length < ex.sets) { s.sets.push(false); s.reps.push(ex.max); }
        while (s.reps.length < ex.sets) s.reps.push(ex.max);
        if (s.rir === undefined || s.rir === null) s.rir = 2;
        if (s.weight === undefined || s.weight === null) s.weight = ex.weight;
        return s;
      }

      /* ---------------------------------------------------------------------------
         PLATE MATH
         --------------------------------------------------------------------------- */
      function platesFor(total) {
        const t = num(total, 0);
        if (t <= BAR_WEIGHT) return { list: [], note: "EMPTY BAR · 20KG" };
        let perSide = (t - BAR_WEIGHT) / 2;
        const list = [];
        for (let i = 0; i < PLATES.length; i++) {
          const p = PLATES[i];
          while (perSide >= p - 0.001) { list.push(p); perSide -= p; }
        }
        return { list: list, note: perSide > 0.02 ? "CLOSEST LOADABLE" : "" };
      }

      function plateHTML(res) {
        if (!res.list.length) return '<span class="mono" style="font-size:9px;color:var(--dim)">' + esc(res.note) + "</span>";
        const perSide = res.list.reduce((a, b) => a + b, 0);
        return res.list.map((p) => '<span class="plate" data-w="' + p + '">' + p + "</span>").join("") +
          '<span class="mono plate-total">' + perSide + "kg / SIDE</span>";
      }

        const dateKey = ymd();

        let totalSets = 0, doneSets = 0;
        day.exercises.forEach((ex) => {

          totalSets += ex.sets;
          doneSets += s.sets.filter(Boolean).length;

        const pills = TRAINING.map((d) =>

        return (

          '<div class="card">' +
          '<div class="row between">' +
          "<div>" +

          '<div class="mono" style="font-size:8px;color:var(--muted);letter-spacing:.14em">COMPLETE</div>' +
          "</div>" +
          "</div>" +
          '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
          '<div class="row between mono small dim"><span>' + doneSets + " / " + totalSets + " SETS</span><span>" +
          (pct === 100 ? "SESSION COMPLETE ✓" : "IN PROGRESS") + "</span></div>" +
          "</div>" +
          cards +
          "</section>"
        );
      }

        const s = getExState(session, ex);
        const best = db.history[ex.id];
        const allDone = s.sets.every(Boolean) && s.sets.length > 0;

          ex.id + '" data-v="' + v + '">' + v + "</button>"

        return (
          '<article class="ex-card" id="card-' + ex.id + '">' +
