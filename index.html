          '<div class="ex-id">' +
          "<h3>" + esc(ex.name) + "</h3>" +
          '<div class="ex-meta">' + ex.sets + " × " + ex.min + "–" + ex.max +
          (ex.recovery ? " REPS/MIN" : " REPS") + " · REST " + fmtRest(ex.rest) + "</div>" +
          "</div>" +
          '<div class="ex-target">' +
          "<span>LOAD</span>" +
          '<input class="load-in mono" type="number" step="2.5" value="' + s.weight +
          '" data-act="ex-weight" data-ex="' + ex.id + '" />' +
          "<em>KG</em>" +
          "</div>" +
          "</div>" +
          bestHTML +
          '<p class="cues">' + esc(ex.cues) + "</p>" +
          '<div class="tools">' +
          '<div class="plate-box">' +
          '<span class="lbl">PLATE CALC · 20KG BAR</span>' +
          '<div class="plates" id="plates-' + ex.id + '">' + plateHTML(platesFor(s.weight)) + "</div>" +
          "</div>" +
          '<div class="rir-box">' +
          '<span class="lbl">RIR</span>' +
          '<div class="rir-sel">' + rirHTML + "</div>" +
          "</div>" +
          "</div>" +
          '<div class="sets" id="sets-' + ex.id + '">' + setsHTML + "</div>" +
          '<div class="overload" id="ovl-' + ex.id + '" style="display:' + (overload ? "flex" : "none") + '">' +
          "⚠ OVERLOAD DETECTED — ALL SETS AT " + ex.max + " REPS. UNLOCK <b>" +
          (ex.inc > 0 ? target + "KG" : "PROGRESSION") + "</b> NEXT WEEK." +
          "</div>" +
          "</article>"
        );
      }

      /* targeted refresh (no full re-render — keeps input focus) */
      function refreshCard(db, session, ex) {
        const s = getExState(session, ex);
        const plateBox = document.getElementById("plates-" + ex.id);
        if (plateBox) plateBox.innerHTML = plateHTML(platesFor(s.weight));

        const ovl = document.getElementById("ovl-" + ex.id);
        if (ovl) {
          const allDone = s.sets.every(Boolean) && s.sets.length > 0;
          const overload = allDone && s.reps.every((r) => num(r, 0) >= ex.max);
          ovl.style.display = overload ? "flex" : "none";
          if (overload) {
            const target = num(s.weight, 0) + ex.inc;
            ovl.innerHTML = "⚠ OVERLOAD DETECTED — ALL SETS AT " + ex.max + " REPS. UNLOCK <b>" +
              (ex.inc > 0 ? target + "KG" : "PROGRESSION") + "</b> NEXT WEEK.";
          }
        }
      }

      /* ---------------------------------------------------------------------------
         VIEW: REFUEL
         --------------------------------------------------------------------------- */
      function dayProtein(db, key) {
        const l = db.logs[key];
        if (!l || !Array.isArray(l.meals)) return 0;
        return l.meals.reduce((a, m) => a + num(m.p, 0), 0);
      }
      function dayCal(db, key) {
        const l = db.logs[key];
        if (!l || !Array.isArray(l.meals)) return 0;
        return l.meals.reduce((a, m) => a + num(m.cal, 0), 0);
      }
      function viewMealPlan() {
        const day = MEAL_PLAN[state.planDay] || MEAL_PLAN.mon;

        const dayPills = Object.keys(MEAL_PLAN).map((k) => {
          const d = MEAL_PLAN[k];
          return '<button class="day-pill ' + (state.planDay === k ? 'on' : '') + '" data-act="plan-day" data-key="' + k + '">' +
            '<b>' + d.label.substring(0, 3) + '</b><span>' + d.focus.split(' ')[0] + '</span></button>';
        }).join('');

        const mealCards = day.meals.map(m =>
          '<div class="card" style="padding:12px; margin-top:8px; border-left:3px solid var(--orange);">' +
          '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">' +
          '<div style="font-family:var(--head); font-size:12px; color:#fff;">' + m.name + '</div>' +
          '<div class="mono" style="font-size:9px; color:var(--muted);">' + m.time + '</div>' +
          '</div>' +
          '<div style="font-size:11.5px; color:var(--muted); line-height:1.4; margin-bottom:10px;">' + esc(m.desc) + '</div>' +
          '<div style="display:flex; gap:12px;">' +
          '<div class="mono" style="font-size:11px; color:var(--green); font-weight:700;">+' + m.p + 'g P</div>' +
          '<div class="mono" style="font-size:11px; color:var(--cyan); font-weight:700;">+' + m.cal + ' kcal</div>' +
          '</div>' +
          '</div>'
        ).join('');

        return (
          '<div style="margin-top:10px;">' +
          '<div class="day-strip" style="margin-bottom:12px;">' + dayPills + '</div>' +

          '<div class="card">' +
          '<div class="row between">' +
          '<div>' +
          '<div class="kicker">DAILY TARGET PROTOCOL</div>' +
          '<h2 class="day-title">' + day.label + '</h2>' +
          '<div class="focus">' + day.focus + '</div>' +
          '</div>' +
          '<div style="text-align:right">' +
          '<div class="mono" style="font-size:20px; font-weight:700; color:var(--green);">' + day.totalP + 'g</div>' +
          '<div class="mono" style="font-size:8px; color:var(--muted); letter-spacing:.14em;">PROTEIN</div>' +
          '<div class="mono" style="font-size:10px; color:var(--cyan); margin-top:2px;">' + day.totalCal + ' kcal</div>' +
          '</div>' +
          '</div>' +
          '</div>' +

          '<div class="kicker" style="margin-top:16px; margin-bottom:4px;">MEAL TIMELINE</div>' +
          mealCards +
          '</div>'
        );
      }

      function viewRefuel(db) {
        const key = state.nutDate;
        const log = db.logs[key] || { meals: [] };
        const meals = Array.isArray(log.meals) ? log.meals : [];
        const target = num(db.settings.proteinTarget, 105) || 105;
        const p = meals.reduce((a, m) => a + num(m.p, 0), 0);
        const cal = meals.reduce((a, m) => a + num(m.cal, 0), 0);
        const pct = Math.max(0, Math.min(1, p / target));

        const R = 52;
        const C = 2 * Math.PI * R;
        const offset = C * (1 - pct);

        /* 7-day rolling matrix ending on selected date */
        let matrix = "";
        for (let i = 6; i >= 0; i--) {
          const k = addDays(key, -i);
          const v = dayProtein(db, k);
          const hit = v >= target;
          matrix += '<div class="mcell ' + (hit ? "hit " : "") + (k === ymd() ? "today" : "") + '">' +
            '<span class="d">' + dayLetter(k) + "</span>" +
            '<span class="v">' + Math.round(v) + "</span></div>";
        }

        const quick = STAPLES.map((s) =>
          '<button class="qbtn" data-act="quick-add" data-name="' + esc(s.name) +
          '" data-p="' + s.p + '" data-cal="' + s.cal + '">' +
          '<span class="qn">' + esc(s.name) + "</span>" +
          '<span class="qp">+' + s.p + "g</span>" +
          "</button>"
        ).join("");

        const mealList = meals.length
          ? meals.map((m) =>
            '<div class="meal">' +
            '<div style="display:flex; align-items:center; gap:10px; min-width:0">' +
            (m.img ? '<img src="' + m.img + '" style="width:38px; height:38px; border-radius:4px; object-fit:cover; border:1px solid var(--border); flex-shrink:0;" />' : '') +
            '<div style="min-width:0">' +
            '<div class="mn">' + esc(m.name) + "</div>" +
            (m.breakdown ? '<div class="mb">' + esc(m.breakdown) + "</div>" : "") +
            "</div>" +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:9px; flex-shrink:0;">' +
            '<div class="mv">+' + num(m.p, 0) + "g<em>" + num(m.cal, 0) + " kcal</em></div>" +
            '<button class="del" data-act="del-meal" data-id="' + m.id + '">✕</button>' +
            "</div>" +
            "</div>"
          ).join("")
          : '<div class="dim" style="font-size:11.5px;padding:8px 0">NO MEALS LOGGED FOR THIS DATE.</div>';

        return (
          '<section class="pad">' +

          // --- NEW TOGGLE BUTTONS ---
          '<div style="display:flex; gap:6px; margin-bottom:4px;">' +
          '<button class="' + (state.refuelView === 'log' ? 'act-btn primary' : 'act-btn') + '" data-act="refuel-toggle" data-view="log" style="margin:0; padding:10px;">DAILY LOG</button>' +
          '<button class="' + (state.refuelView === 'plan' ? 'act-btn primary' : 'act-btn') + '" data-act="refuel-toggle" data-view="plan" style="margin:0; padding:10px;">MEAL PROTOCOL</button>' +
          '</div>' +

          // --- CONDITIONAL RENDER ---
          (state.refuelView === 'plan' ? viewMealPlan() : (

            '<div class="date-nav">' +
            '<button data-act="nut-prev">◀ PREV</button>' +
            '<input type="date" value="' + key + '" data-act="nut-date" />' +
            '<button data-act="nut-next">NEXT ▶</button>' +
            "</div>" +

            '<div class="card">' +
            '<div class="kicker" style="margin-bottom:8px">DAILY PROTEIN PROGRESS · ' + esc(fmtDate(key)) + "</div>" +
            '<div class="ring-wrap">' +
            '<div class="ring-box">' +
            '<svg class="ring" viewBox="0 0 120 120">' +
            "<defs>" +
            '<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">' +
            '<stop offset="0%" stop-color="#f0a030"/>' +
            '<stop offset="100%" stop-color="#3fb27f"/>' +
            "</linearGradient>" +
            "</defs>" +
            '<circle class="ring-bg" cx="60" cy="60" r="' + R + '"/>' +
            '<circle class="ring-fg" cx="60" cy="60" r="' + R + '" ' +
            'stroke-dasharray="' + C.toFixed(2) + '" ' +
            'stroke-dashoffset="' + offset.toFixed(2) + '"/>' +
            "</svg>" +
            '<div class="ring-center">' +
            '<div class="big">' + Math.round(p) + "</div>" +
            '<div class="of">/ ' + target + "G PROTEIN</div>" +
            '<div class="kcal">' + Math.round(cal) + " KCAL</div>" +
            "</div>" +
            "</div>" +
            '<div class="ring-stats">' +
            '<div class="stat-line"><span>PROTEIN</span><b class="' + (p >= target ? "ok" : "bad") + '">' +
            Math.round(p) + " / " + target + "g</b></div>" +
            '<div class="stat-line"><span>REMAINING</span><b>' + Math.max(0, Math.round(target - p)) + "g</b></div>" +
            '<div class="stat-line"><span>ENERGY</span><b>' + Math.round(cal) + " kcal</b></div>" +
            '<div class="stat-line"><span>MEALS</span><b>' + meals.length + "</b></div>" +
            '<div class="stat-line"><span>TARGET</span><b class="ok">' +
            (p >= target ? "HIT ✓" : "PENDING") + "</b></div>" +
            "</div>" +
            "</div>" +
            "</div>" +

            '<div class="card">' +
            '<div class="kicker" style="margin-bottom:9px">1-TAP STAPLES</div>' +
            '<div class="quick-grid">' + quick + "</div>" +
            "</div>" +

            '<div class="card">' +
            '<div class="kicker" style="margin-bottom:9px">AI PLATE SCANNER</div>' +
            '<button class="scan-btn" data-act="scan">' +
            '<svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>' +
            '<circle cx="12" cy="12" r="3.5"/></svg>' +
            "SCAN MEAL" +
            "</button>" +
            '<div class="manual" style="margin-top: 10px;">' +
            '<input id="aiTextInput" type="text" placeholder="Or type: \'2 eggs and toast\'..." style="grid-column: span 3;" />' +
            '<button data-act="ai-text-log">ASK AI</button>' +
            '</div>' +
            scanResultHTML() +
            "</div>" +

            '<div class="card">' +
            '<div class="kicker" style="margin-bottom:9px">MANUAL ENTRY</div>' +
            '<div class="manual">' +
            '<input id="mName" type="text" placeholder="Meal name" maxlength="60" />' +
            '<input id="mP" type="number" placeholder="P (g)" min="0" max="500" />' +
            '<input id="mCal" type="number" placeholder="kcal" min="0" max="5000" />' +
            '<button data-act="manual-add">ADD</button>' +
            "</div>" +
            "</div>" +

            '<div class="card">' +
            '<div class="kicker" style="margin-bottom:4px">LOG · ' + esc(key) + "</div>" +
            mealList +
            "</div>"

          )) +
          "</section>"
        );
      }

      function scanResultHTML() {
        const s = state.scan || { status: "idle" };
        if (s.status === "loading") {
          return '<div class="scan-result load"><h4><span class="spinner"></span> ANALYSING IMAGE…</h4>' +
            '<div class="dim" style="font-size:11px">Sending to plate-vision. Non-food items will be rejected.</div></div>';
        }
        if (s.status === "reject") {
          return '<div class="scan-result bad"><h4>✕ NON-FOOD DETECTED</h4>' +
            '<div style="font-size:11.5px;color:var(--muted)">' +
            esc((s.data && s.data.breakdown) || "Rejected: not a food item.") +
            "</div>" +
            '<div class="mono" style="font-size:10px;color:var(--red);margin-top:7px">0G PROTEIN LOGGED</div>' +
            '<button class="act-btn" data-act="scan-clear" style="margin-top:9px">DISMISS</button></div>';
        }
        if (s.status === "error") {
          return '<div class="scan-result bad"><h4>⚠ SCAN FAILED</h4>' +
            '<div style="font-size:11.5px;color:var(--muted)">' +
            esc(s.message || "Vision service unavailable. Enter manually.") + "</div>" +
            '<button class="act-btn" data-act="scan-clear" style="margin-top:9px">DISMISS</button></div>';
        }
        if (s.status === "ok") {
          const d = s.data || {};
          return '<div class="scan-result ok">' +
            "<h4>✓ " + esc(d.name || "Meal Detected") + "</h4>" +
            (s.img ? '<img src="' + s.img + '" style="width:100%; height:160px; object-fit:cover; border-radius:4px; margin-bottom:8px; border:1px solid rgba(63,178,127,0.3);" />' : '') +
            '<div class="scan-macros"><span class="p">' + num(d.p, 0) + "g P</span>" +
            '<span class="c">' + num(d.cal, 0) + " KCAL</span></div>" +
            '<div style="font-size:11px;color:var(--muted)">' + esc(d.breakdown || "") + "</div>" +
            '<button class="confirm-btn" data-act="scan-confirm">✓ CONFIRM &amp; LOG</button>' +
            '<button class="act-btn" data-act="scan-clear" style="margin-top:6px">CANCEL</button>' +
            "</div>";
        }
        return "";
      }

      /* ---------------------------------------------------------------------------
         VIEW: VAULT
         --------------------------------------------------------------------------- */
      function viewVault(db) {
        const blocks = MILESTONES.map((m) => {
          const p = db.photos[m.k] || {};
          const slots = POSES.map((pose) =>
            '<button class="photo-slot" data-act="photo" data-ms="' + m.k + '" data-pose="' + pose + '">' +
            (p[pose]
              ? '<img src="' + p[pose] + '" alt="' + m.label + " " + pose + '" loading="lazy" />'
              : '<span class="ph-empty"><span>+</span><em>' + pose.toUpperCase() + "</em></span>") +
            "</button>"
          ).join("");
          return '<div class="ms-block">' +
            '<div class="ms-head"><h3>' + m.label + "</h3><span>" + m.sub + "</span></div>" +
            '<div class="ms-grid">' + slots + "</div>" +
            "</div>";
        }).join("");

        const msOpts = MILESTONES.map((m) =>
          '<option value="' + m.k + '">' + m.label + "</option>").join("");
        const poseOpts = POSES.map((p) =>
          '<option value="' + p + '"' + (state.cmpPose === p ? " selected" : "") + ">" + p.toUpperCase() + "</option>").join("");

        const imgA = (db.photos[state.cmpA] || {})[state.cmpPose];
        const imgB = (db.photos[state.cmpB] || {})[state.cmpPose];

        return (
          '<section class="pad">' +
          '<div class="card">' +
          '<div class="kicker">8-WEEK PHYSIQUE VAULT</div>' +
          '<h2 class="day-title" style="margin-top:3px">BI-WEEKLY MILESTONES</h2>' +
          '<div class="dim" style="font-size:11px;margin-top:5px">' +
          "Photos are compressed on-device before storage. Tap a slot to capture or upload." +
          "</div>" +
          "</div>" +
          blocks +

          '<div class="card">' +
          '<div class="kicker" style="margin-bottom:9px">SIDE-BY-SIDE COMPARISON</div>' +
          '<div class="sel-row">' +
          '<select data-act="cmp-a">' +
          MILESTONES.map((m) => '<option value="' + m.k + '"' +
            (state.cmpA === m.k ? " selected" : "") + ">" + m.label + "</option>").join("") +
          "</select>" +
          '<select data-act="cmp-pose">' + poseOpts + "</select>" +
          '<select data-act="cmp-b">' +
          MILESTONES.map((m) => '<option value="' + m.k + '"' +
            (state.cmpB === m.k ? " selected" : "") + ">" + m.label + "</option>").join("") +
          "</select>" +
          "</div>" +
          '<div class="cmp-grid">' +
          '<div class="cmp-slot">' +
          (imgA ? '<img src="' + imgA + '" alt="A" />' : '<span class="ph-empty"><em>NO IMAGE</em></span>') +
          '<div class="tag">' + state.cmpA.toUpperCase() + " · " + state.cmpPose.toUpperCase() + "</div>" +
          "</div>" +
          '<div class="cmp-slot">' +
          (imgB ? '<img src="' + imgB + '" alt="B" />' : '<span class="ph-empty"><em>NO IMAGE</em></span>') +
          '<div class="tag">' + state.cmpB.toUpperCase() + " · " + state.cmpPose.toUpperCase() + "</div>" +
          "</div>" +
          "</div>" +
          "</div>" +
          "</section>"
        );
      }

      /* ---------------------------------------------------------------------------
         VIEW: BLUEPRINT DECK
         --------------------------------------------------------------------------- */
      function viewBlueprint() {
        const cards = BLUEPRINTS.map((bp) =>
          '<button class="bp-card ' + (bp.full ? 'full-width' : '') + '" data-act="open-bp" data-key="' + bp.key + '">' +
          '<img class="bp-img" src="' + bp.src + '" alt="' + esc(bp.label) + '" loading="lazy" />' +
          '<span class="bp-label">' + esc(bp.label) + "</span>" +
          "</button>"
        ).join("");

        return (
          '<section class="pad">' +
          '<div class="card">' +
          '<div class="kicker">OPERATOR BLUEPRINT DECK</div>' +
          '<h2 class="day-title" style="margin-top:3px">VISUAL TRAINING CARDS</h2>' +
          '<div class="dim" style="font-size:11px;margin-top:5px">Tap any card to open the zoomable full-screen viewer.</div>' +
          "</div>" +
          '<div class="bp-grid">' + cards + "</div>" +
          "</section>"
        );
      }

      /* ---------------------------------------------------------------------------
         VIEW: SYSTEM
         --------------------------------------------------------------------------- */
      function viewSystem(db) {
        let bytes = 0;
        try { bytes = new Blob([JSON.stringify(db)]).size; } catch (e) { bytes = JSON.stringify(db).length; }
        const kb = (bytes / 1024).toFixed(1);

        const mealCount = Object.keys(db.logs).reduce((a, k) => {
          const l = db.logs[k];
          return a + (l && Array.isArray(l.meals) ? l.meals.length : 0);
        }, 0);
        const sessionCount = Object.keys(db.workouts).length;
        const photoCount = Object.keys(db.photos).reduce((a, k) =>
          a + POSES.filter((p) => (db.photos[k] || {})[p]).length, 0);
        const bestCount = Object.keys(db.history).length;

        const swState = ("serviceWorker" in navigator && navigator.serviceWorker.controller)
          ? "ACTIVE" : (("serviceWorker" in navigator) ? "REGISTERED" : "UNSUPPORTED");

        return (
          '<section class="pad">' +
          '<div class="card">' +
          '<div class="kicker">SYSTEM STATUS</div>' +
          '<h2 class="day-title" style="margin-top:3px">DIAGNOSTICS</h2>' +
          '<div class="sys-row"><span class="dim">DB VERSION</span><span class="v">v' + db.version + "</span></div>" +
          '<div class="sys-row"><span class="dim">STORAGE KEY</span><span class="v">' + DB_KEY + "</span></div>" +
          '<div class="sys-row"><span class="dim">PAYLOAD SIZE</span><span class="v">' + kb + " KB</span></div>" +
          '<div class="sys-row"><span class="dim">MEALS LOGGED</span><span class="v">' + mealCount + "</span></div>" +
          '<div class="sys-row"><span class="dim">SESSIONS STORED</span><span class="v">' + sessionCount + "</span></div>" +
          '<div class="sys-row"><span class="dim">PERSONAL BESTS</span><span class="v">' + bestCount + "</span></div>" +
          '<div class="sys-row"><span class="dim">VAULT PHOTOS</span><span class="v">' + photoCount + "</span></div>" +
          '<div class="sys-row"><span class="dim">SERVICE WORKER</span><span class="v">' + swState + "</span></div>" +
          "</div>" +

          '<div class="card">' +
          '<div class="kicker" style="margin-bottom:6px">PROTEIN TARGET</div>' +
          '<div class="row between">' +
          '<input id="targetInput" class="load-in mono" type="number" min="20" max="400" value="' +
          num(db.settings.proteinTarget, 105) + '" style="width:90px;text-align:center" />' +
          '<button class="act-btn" data-act="save-target" style="width:auto;margin:0;padding:9px 16px">SAVE</button>' +
          "</div>" +
          "</div>" +

          '<div class="card">' +
          '<div class="kicker" style="margin-bottom:4px">BACKUP &amp; RESTORE</div>' +
          '<button class="act-btn primary" data-act="export">⭳ EXPORT JSON BACKUP</button>' +
          '<button class="act-btn" data-act="import">⭱ IMPORT JSON BACKUP</button>' +
          '<div class="dim" style="font-size:10.5px;margin-top:9px;line-height:1.5">' +
          "Import runs a full multi-key migration — legacy v1/v2 backups are automatically upgraded." +
          "</div>" +
          "</div>" +

          '<div class="card">' +
          '<div class="kicker" style="margin-bottom:4px">DANGER ZONE</div>' +
          '<button class="act-btn danger" data-act="reset">⌫ PURGE ALL LOCAL DATA</button>' +
          "</div>" +
          "</section>"
        );
      }

      /* ---------------------------------------------------------------------------
         MASTER RENDER
         --------------------------------------------------------------------------- */
      function render() {
        const db = getDB();
        const view = document.getElementById("view");
        let html = "";

        if (state.tab === "mission") html = viewMission(db);
        else if (state.tab === "refuel") html = viewRefuel(db);
        else if (state.tab === "vault") html = viewVault(db);
        else if (state.tab === "blueprint") html = viewBlueprint();
        else html = viewSystem(db);

        view.innerHTML = html;

        $$("#tabs button").forEach((b) => {
          b.classList.toggle("active", b.dataset.tab === state.tab);
        });
      }

      /* ---------------------------------------------------------------------------
         REST TIMER
         --------------------------------------------------------------------------- */
      const rest = { endAt: 0, total: 0, handle: null };

      function startRest(seconds) {
        if (!seconds || seconds <= 0) return;
        rest.total = seconds;
        rest.endAt = Date.now() + seconds * 1000;
        const bar = document.getElementById("restBar");
        bar.classList.add("show");
        bar.classList.remove("ringing");
        $$("#restBar .rest-presets button").forEach((b) => {
          b.classList.toggle("on", Number(b.dataset.s) === seconds);
        });
        tickRest();
        if (rest.handle) clearInterval(rest.handle);
        rest.handle = setInterval(tickRest, 200);
      }

      function tickRest() {
        const left = Math.max(0, Math.round((rest.endAt - Date.now()) / 1000));
        const clock = document.getElementById("restClock");
        const m = Math.floor(left / 60);
        const s = left % 60;
        clock.textContent = m + ":" + pad2(s);
        if (left <= 0) finishRest();
      }

      function finishRest() {
        if (rest.handle) { clearInterval(rest.handle); rest.handle = null; }
        const bar = document.getElementById("restBar");
        bar.classList.add("ringing");
        document.getElementById("restClock").textContent = "GO";
        if (navigator.vibrate) {
          try { navigator.vibrate([220, 110, 220, 110, 320]); } catch (e) { }
        }
        setTimeout(() => {
          bar.classList.remove("show", "ringing");
        }, 3200);
      }

      function stopRest() {
        if (rest.handle) { clearInterval(rest.handle); rest.handle = null; }
        const bar = document.getElementById("restBar");
        bar.classList.remove("show", "ringing");
      }

      /* ---------------------------------------------------------------------------
         IMAGE COMPRESSION
         --------------------------------------------------------------------------- */
      function compressImage(file, maxDim, quality) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = function () {
            try {
              let w = img.naturalWidth || img.width;
              let h = img.naturalHeight || img.height;
              const scale = Math.min(1, maxDim / Math.max(w, h));
              const cw = Math.max(1, Math.round(w * scale));
              const ch = Math.max(1, Math.round(h * scale));
              const canvas = document.createElement("canvas");
              canvas.width = cw;
              canvas.height = ch;
              const ctx = canvas.getContext("2d");
              ctx.fillStyle = "#0d1115";
              ctx.fillRect(0, 0, cw, ch);
              ctx.drawImage(img, 0, 0, cw, ch);
              URL.revokeObjectURL(url);
              resolve(canvas.toDataURL("image/jpeg", quality));
            } catch (err) {
              URL.revokeObjectURL(url);
              reject(err);
            }
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error("Image decode failed"));
          };
          img.src = url;
        });
      }

      /* ---------------------------------------------------------------------------
         ACTIONS
         --------------------------------------------------------------------------- */
      function currentEx(exId) {
        const day = getDay(state.dayKey);
        return day.exercises.filter((e) => e.id === exId)[0];
      }

      function withSession(mutator) {
        const db = getDB();
        const day = getDay(state.dayKey);
        const session = getSession(db, day.key, ymd());
        mutator(db, session, day);
        saveDB(db);
        return { db: db, session: session, day: day };
      }

      function toggleSet(exId, i) {
        const day = getDay(state.dayKey);
        const ex = day.exercises.filter((e) => e.id === exId)[0];
        if (!ex) return;

        const db = getDB();
        const session = getSession(db, day.key, ymd());
        const s = getExState(session, ex);

        const wasOn = !!s.sets[i];
        s.sets[i] = !wasOn;

        if (!wasOn) {
          const best = db.history[exId];
          const allDone = s.sets.every(Boolean);
          if (allDone) {
            const w = num(s.weight, 0);
            const topReps = s.reps.map((r) => num(r, 0)).reduce((a, b) => Math.max(a, b), 0);
            if (w > 0 && (!best || w > best.weight)) {
              db.history[exId] = { weight: w, reps: topReps, date: ymd() };
              saveDB(db);
              toast("NEW BEST LOGGED · " + ex.name.toUpperCase(), "green");
              render();
              startRest(ex.rest);
              return;
            }
          }
        }

        saveDB(db);
        render();
        if (!wasOn && ex.rest > 0) startRest(ex.rest);
      }

      /* ---- scan ---- */
      async function handleFoodFile(file) {
        if (!file) return;
        state.scan = { status: "loading" };
        render();

        try {
          // 1. Large image for AI
          const dataUrl = await compressImage(file, 850, 0.78);
          const base64 = dataUrl.split(",")[1];

          // 2. Tiny image for the log
          const thumbnail = await compressImage(file, 100, 0.5);

          const res = await fetch("/api/plate-vision", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: base64 })
          });

          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();

          if (data && data.error && data.is_food !== true) {
            state.scan = { status: "error", message: (data.breakdown || "Vision service unavailable.") };
          } else if (!data || data.is_food !== true) {
            state.scan = { status: "reject", data: data || {} };
          } else {
            state.scan = { status: "ok", data: data, img: thumbnail }; // <--- SAVE THUMBNAIL HERE
          }
        } catch (err) {
          console.error("[plate-vision]", err);
          state.scan = { status: "error", message: "Network or service error: " + (err.message || "unknown") };
        }
        render();
      }

      function addMealToDB(name, p, cal, breakdown, img) {
        const db = getDB();
        const key = state.nutDate;
        if (!db.logs[key] || typeof db.logs[key] !== "object") db.logs[key] = { meals: [] };
        if (!Array.isArray(db.logs[key].meals)) db.logs[key].meals = [];
        db.logs[key].meals.push({
          id: uid(),
          name: String(name || "Meal").slice(0, 90),
          p: num(p, 0),
          cal: num(cal, 0),
          breakdown: String(breakdown || "").slice(0, 240),
          img: img || null, // <--- ADD THIS
          at: Date.now()
        });
        saveDB(db);
        return db;
      }

      /* ---- photos ---- */
      async function handlePhotoFile(file) {
        if (!file || !state.photoTarget) return;
        const target = state.photoTarget;
        state.photoTarget = null;
        try {
          const dataUrl = await compressImage(file, 620, 0.62);
          const db = getDB();
          if (!db.photos[target.ms] || typeof db.photos[target.ms] !== "object") db.photos[target.ms] = {};
          db.photos[target.ms][target.pose] = dataUrl;
          if (saveDB(db)) {
            toast("PHOTO SAVED · " + target.ms.toUpperCase() + " " + target.pose.toUpperCase(), "green");
          }
        } catch (e) {
          console.error(e);
          toast("IMAGE PROCESSING FAILED", "red");
        }
        render();
      }

      /* ---- import / export ---- */
      function exportJSON() {
        const db = getDB();
        const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "operator-log-backup-" + ymd() + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast("BACKUP EXPORTED", "cyan");
      }

      async function importJSON(file) {
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (!window.confirm("IMPORT WILL REPLACE ALL CURRENT DATA. CONTINUE?")) return;
          const db = migrate(parsed);
          if (saveDB(db)) {
            render();
            toast("DATA IMPORTED · v" + db.version, "green");
          }
        } catch (e) {
          console.error(e);
          toast("IMPORT FAILED — INVALID JSON", "red");
        }
      }

      /* ---------------------------------------------------------------------------
         LIGHTBOX (zoom + pan)
         --------------------------------------------------------------------------- */
      const lb = { scale: 1, x: 0, y: 0, dragging: false, sx: 0, sy: 0, ox: 0, oy: 0, pointers: {}, pinchDist: 0 };

      function applyLB() {
        const c = document.getElementById("lbContent");
        c.style.transform = "translate(" + lb.x + "px," + lb.y + "px) scale(" + lb.scale + ")";
      }

      function openLightbox(key) {
        const bp = BLUEPRINTS.find(b => b.key === key);
        if (!bp) return;

        state.bpKey = key;
        document.getElementById("lbTitle").textContent = bp.label.toUpperCase();
        document.getElementById("lbContent").innerHTML = '<img src="' + bp.src + '" alt="' + esc(bp.label) + '" />';

        lb.scale = 1; lb.x = 0; lb.y = 0;
        applyLB();
        document.getElementById("lightbox").classList.add("open");
      }

      function closeLightbox() {
        document.getElementById("lightbox").classList.remove("open");
        state.bpKey = null;
      }

      /* ---------------------------------------------------------------------------
         EVENT DELEGATION
         --------------------------------------------------------------------------- */
      document.addEventListener("click", function (ev) {
        const el = ev.target.closest("[data-act]");
        if (!el) return;
        const act = el.dataset.act;

        /* --- navigation --- */
        if (act === "tab") {
          state.tab = el.dataset.tab;
          render();
          window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
          return;
        }

        /* --- mission --- */
        if (act === "pick-day") {
          state.dayKey = el.dataset.key;
          render();
          return;
        }
        if (act === "toggle-set") {
          toggleSet(el.dataset.ex, Number(el.dataset.i));
          return;
        }
        if (act === "set-rir") {
          const exId = el.dataset.ex;
          withSession(function (db, session) {
            const ex = currentEx(exId);
            const s = getExState(session, ex);
            s.rir = Number(el.dataset.v);
          });
          render();
          return;
        }
        if (act === "rest-preset") {
          startRest(Number(el.dataset.s));
          return;
        }
        if (act === "rest-skip") {
          stopRest();
          return;
        }

        /* --- refuel --- */
        if (act === "nut-prev") { state.nutDate = addDays(state.nutDate, -1); render(); return; }
        if (act === "nut-next") { state.nutDate = addDays(state.nutDate, 1); render(); return; }

        if (act === "quick-add") {
          addMealToDB(el.dataset.name, el.dataset.p, el.dataset.cal, "Quick staple entry.");
          render();
          toast("LOGGED · " + el.dataset.name.toUpperCase(), "green");
          return;
        }
        if (act === "del-meal") {
          const id = el.dataset.id;
          const db = getDB();
          const log = db.logs[state.nutDate];
          if (log && Array.isArray(log.meals)) {
            log.meals = log.meals.filter((m) => m.id !== id);
            saveDB(db);
          }
          render();
          return;
        }
        if (act === "manual-add") {
          const n = document.getElementById("mName");
          const p = document.getElementById("mP");
          const c = document.getElementById("mCal");
          if (!n || !n.value.trim()) { toast("ENTER A MEAL NAME", "red"); return; }
          addMealToDB(n.value.trim(), p ? p.value : 0, c ? c.value : 0, "Manual entry.");
          render();
          toast("MEAL ADDED", "green");
          return;
        }
        if (act === "scan") {
          const inp = document.getElementById("foodInput");
          inp.value = "";
          inp.click();
          return;
        }

        /* --- NEW AI TEXT LOGGER --- */
        if (act === "ai-text-log") {
          const input = document.getElementById("aiTextInput");
          const text = input.value.trim();
          if (!text) return;

          el.textContent = "...";
          fetch("/api/text-macros", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text })
          })
            .then(r => r.json())
            .then(data => {
              if (data.p > 0) {
                addMealToDB(data.name, data.p, data.cal, data.breakdown);
                render();
                toast("LOGGED VIA AI", "green");
              } else {
                toast("AI couldn't find food", "red");
                el.textContent = "ASK AI";
              }
            }).catch(() => { toast("Error", "red"); el.textContent = "ASK AI"; });
          return;
        }
        /* -------------------------- */
        if (act === "scan-clear") { state.scan = { status: "idle" }; render(); return; }
        if (act === "scan-confirm") {
          const d = state.scan.data || {};
          const img = state.scan.img || null; // <--- GET THE IMAGE
          addMealToDB(d.name || "Scanned Meal", d.p, d.cal, d.breakdown || "", img); // <--- PASS IT
          state.scan = { status: "idle" };
          render();
          toast("MEAL LOGGED · +" + num(d.p, 0) + "G PROTEIN", "green");
          return;
        }

        /* --- vault --- */
        if (act === "photo") {
          state.photoTarget = { ms: el.dataset.ms, pose: el.dataset.pose };
          const inp = document.getElementById("photoInput");
          inp.value = "";
          inp.click();
          return;
        }

        /* --- blueprint --- */
        if (act === "open-bp") { openLightbox(el.dataset.key); return; }
        if (act === "lb-close") { closeLightbox(); return; }
        if (act === "lb-in") { lb.scale = Math.min(4, lb.scale * 1.25); applyLB(); return; }
        if (act === "lb-out") { lb.scale = Math.max(0.5, lb.scale / 1.25); applyLB(); return; }
        if (act === "lb-reset") { lb.scale = 1; lb.x = 0; lb.y = 0; applyLB(); return; }

        /* --- system --- */
        if (act === "save-target") {
          const v = document.getElementById("targetInput");
          const db = getDB();
          db.settings.proteinTarget = Math.max(20, Math.min(400, num(v.value, 105)));
          saveDB(db);
          render();
          toast("TARGET UPDATED · " + db.settings.proteinTarget + "G", "green");
          return;
        }
        if (act === "export") { exportJSON(); return; }
        if (act === "import") {
          const inp = document.getElementById("importInput");
          inp.value = "";
          inp.click();
          return;
        }
        if (act === "reset") {
          if (!window.confirm("PURGE ALL LOCAL DATA? This cannot be undone. Export a backup first.")) return;
          try {
            localStorage.removeItem(DB_KEY);
            LEGACY_KEYS.forEach((k) => localStorage.removeItem(k));
          } catch (e) { }
          render();
          toast("ALL DATA PURGED", "red");
          return;
        }
        if (act === "refuel-toggle") {
          state.refuelView = el.dataset.view;
          render();
          return;
        }
        if (act === "plan-day") {
          state.planDay = el.dataset.key;
          render();
          return;
        }
      });

      /* ---- input handling (no re-render → keeps focus) ---- */
      document.addEventListener("input", function (ev) {
        const el = ev.target.closest("[data-act]");
        if (!el) return;
        const act = el.dataset.act;

        if (act === "ex-reps") {
          const exId = el.dataset.ex;
          const idx = Number(el.dataset.i);
          const db = getDB();
          const day = getDay(state.dayKey);
          const ex = day.exercises.filter((e) => e.id === exId)[0];
          if (!ex) return;
          const session = getSession(db, day.key, ymd());
          const s = getExState(session, ex);
          s.reps[idx] = num(el.value, 0);
          saveDB(db);
          refreshCard(db, session, ex);
          return;
        }

        if (act === "ex-weight") {
          const exId = el.dataset.ex;
          const db = getDB();
          const day = getDay(state.dayKey);
          const ex = day.exercises.filter((e) => e.id === exId)[0];
          if (!ex) return;
          const session = getSession(db, day.key, ymd());
          const s = getExState(session, ex);
          s.weight = num(el.value, 0);
          saveDB(db);
          refreshCard(db, session, ex);
          return;
        }
      });

      /* ---- change handling ---- */
      document.addEventListener("change", function (ev) {
        const el = ev.target.closest("[data-act]");
        if (!el) return;
        const act = el.dataset.act;

        if (act === "nut-date") {
          const v = el.value;
          if (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) { state.nutDate = v; render(); }
          return;
        }
        if (act === "cmp-a") { state.cmpA = el.value; render(); return; }
        if (act === "cmp-b") { state.cmpB = el.value; render(); return; }
        if (act === "cmp-pose") { state.cmpPose = el.value; render(); return; }
      });

      /* ---- file inputs ---- */
      document.getElementById("foodInput").addEventListener("change", function (e) {
        const f = e.target.files && e.target.files[0];
        if (f) handleFoodFile(f);
      });
      document.getElementById("photoInput").addEventListener("change", function (e) {
        const f = e.target.files && e.target.files[0];
        if (f) handlePhotoFile(f);
        else state.photoTarget = null;
      });
      document.getElementById("importInput").addEventListener("change", function (e) {
        const f = e.target.files && e.target.files[0];
        if (f) importJSON(f);
      });

      /* ---- lightbox pan / zoom ---- */
      (function initLightboxGestures() {
        const stage = document.getElementById("lbStage");

        stage.addEventListener("wheel", function (e) {
          if (!document.getElementById("lightbox").classList.contains("open")) return;
          e.preventDefault();
          const delta = e.deltaY > 0 ? 0.9 : 1.1;
          lb.scale = Math.max(0.5, Math.min(4, lb.scale * delta));
          applyLB();
        }, { passive: false });

        stage.addEventListener("pointerdown", function (e) {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          stage.setPointerCapture(e.pointerId);
          lb.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
          const ids = Object.keys(lb.pointers);
          if (ids.length === 1) {
            lb.dragging = true;
            lb.sx = e.clientX; lb.sy = e.clientY;
            lb.ox = lb.x; lb.oy = lb.y;
          } else if (ids.length === 2) {
            lb.dragging = false;
            const a = lb.pointers[ids[0]], b = lb.pointers[ids[1]];
            lb.pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
          }
        });

        stage.addEventListener("pointermove", function (e) {
          if (!lb.pointers[e.pointerId]) return;
          lb.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
          const ids = Object.keys(lb.pointers);

          if (ids.length >= 2) {
            const a = lb.pointers[ids[0]], b = lb.pointers[ids[1]];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            if (lb.pinchDist > 0) {
              const ratio = d / lb.pinchDist;
              lb.scale = Math.max(0.5, Math.min(4, lb.scale * ratio));
              lb.pinchDist = d;
              applyLB();
            }
            return;
          }

          if (lb.dragging) {
            lb.x = lb.ox + (e.clientX - lb.sx);
            lb.y = lb.oy + (e.clientY - lb.sy);
            applyLB();
          }
        });

        function release(e) {
          delete lb.pointers[e.pointerId];
          if (Object.keys(lb.pointers).length < 2) lb.pinchDist = 0;
          if (Object.keys(lb.pointers).length === 0) lb.dragging = false;
        }
        stage.addEventListener("pointerup", release);
        stage.addEventListener("pointercancel", release);
        stage.addEventListener("pointerleave", function (e) {
          if (e.pointerType === "mouse") release(e);
        });
      })();

      /* ---- clock ---- */
      function tickClock() {
        const d = new Date();
        const el = document.getElementById("sysClock");
        if (el) el.textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      }

      /* ---------------------------------------------------------------------------
         BOOT
         --------------------------------------------------------------------------- */
      function boot() {
        state.nutDate = ymd();
        state.dayKey = todayDayKey();

        /* ensure DB exists + persisted under the current key */
        const db = getDB();
        saveDB(db);

        render();
        tickClock();
        setInterval(tickClock, 20000);

        /* service worker */
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("/sw.js").catch(function (e) {
              console.warn("[OPLOG] SW registration failed", e);
            });
          });
        }

        /* prevent accidental pull-to-refresh while dragging the lightbox */
        document.addEventListener("touchmove", function (e) {
          if (document.getElementById("lightbox").classList.contains("open")) e.preventDefault();
        }, { passive: false });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }

    })();
  </script>
