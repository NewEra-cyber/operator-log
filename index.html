<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <title>OPERATOR LOG // TACTICAL SUITE PRO</title>
  <meta name="theme-color" content="#0d1115" />
  <meta name="description" content="Tactical workout, nutrition and physique tracker. Offline-first." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OP LOG" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/images/logo.jpg" type="image/png" />
  <link rel="apple-touch-icon" href="/images/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    /* ============================================================
   TOKENS
   ============================================================ */
    :root {
      --bg: #050505;
      --card: rgba(15, 15, 18, 0.7);
      /* Semi-transparent for glass effect */
      --card-solid: #0f0f12;
      /* Fallback */
      --border: rgba(255, 42, 42, 0.2);
      /* Faint red border */
      --orange: #ff2a2a;
      --green: #3fb27f;
      --red: #ff2a2a;
      --cyan: #ff6b6b;
      --txt: #ffffff;
      --muted: #8a8a8a;
      --dim: #555555;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --head: 'Chakra Petch', system-ui, sans-serif;
      --body: 'Inter', system-ui, -apple-system, sans-serif;
      --nav-h: 64px;
      /* Slightly taller nav */
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      background-color: var(--bg);
    }

    body {
      background-color: var(--bg);
      color: var(--txt);
      font-family: var(--body);
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));

      /* TACTICAL GRID & GLOW BACKGROUND */
      background-image:
        radial-gradient(circle at 15% 0%, rgba(255, 42, 42, 0.15), transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(63, 178, 127, 0.08), transparent 40%),
        linear-gradient(rgba(255, 42, 42, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 42, 42, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--head);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 0;
      line-height: 1.2
    }

    button {
      font-family: inherit;
      cursor: pointer
    }

    input,
    select,
    textarea {
      font-family: inherit
    }

    input[type=number] {
      -moz-appearance: textfield
    }

    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
    }

    .dim {
      color: var(--muted)
    }

    .small {
      font-size: 11px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .between {
      justify-content: space-between
    }

    /* ============================================================
   HEADER + HAZARD
   ============================================================ */
    header.app-head {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .hazard {
      height: 4px;
      background: repeating-linear-gradient(90deg, var(--orange) 0 15px, #0d1115 15px 30px);
      opacity: 0.8;
      box-shadow: 0 0 10px var(--orange);
    }

    /* Add a subtle scanning animation to the header */
    header.app-head::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    .head-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 14px;
      max-width: 820px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      border: 1.5px solid var(--orange);
      display: grid;
      place-items: center;
      color: var(--orange);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      position: relative;
    }

    .brand-mark::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(240, 160, 48, .35);
    }

    .brand h1 {
      font-size: 13px;
      letter-spacing: .13em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .brand small {
      display: block;
      font-family: var(--mono);
      font-size: 8.5px;
      color: var(--muted);
      letter-spacing: .16em;
      font-weight: 400;
      margin-top: 1px;
    }

    .head-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--green);
      border: 1px solid rgba(63, 178, 127, .32);
      background: rgba(63, 178, 127, .08);
      padding: 4px 8px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2.2s infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    /* ============================================================
   LAYOUT
   ============================================================ */
    main#view {
      display: block
    }

    .pad {
      padding: 12px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 820px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 42, 42, 0.2);
      /* Highlight top edge */
      border-radius: 6px;
      padding: 16px;
      position: relative;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .kicker {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ============================================================
   DAY STRIP
   ============================================================ */
    .day-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .day-strip::-webkit-scrollbar {
      display: none
    }

    .day-pill {
      flex: 0 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 7px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      color: var(--muted);
      font-family: var(--head);
      letter-spacing: .09em;
      transition: .15s;
    }

    .day-pill b {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700
    }

    .day-pill span {
      font-size: 8.5px;
      opacity: .85
    }

    .day-pill.on {
      border-color: var(--orange);
      color: var(--orange);
      background: rgba(240, 160, 48, .1);
      box-shadow: inset 0 0 0 1px rgba(240, 160, 48, .22);
    }

    /* ============================================================
   MISSION HEADER CARD
   ============================================================ */
    .day-title {
      font-size: 20px;
      color: #fff;
      margin-top: 4px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .focus {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--cyan);
      letter-spacing: .12em;
      margin-top: 3px
    }

    .progress {
      height: 5px;
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin: 11px 0 7px;
    }

    .progress i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--orange), #ffd27a);
      transition: width .3s ease;
    }

    /* ============================================================
   EXERCISE CARD
   ============================================================ */
    .ex-card {
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 16px;
      position: relative;
      margin-top: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .ex-card:active {
      transform: scale(0.98);
      box-shadow: 0 0 20px rgba(255, 42, 42, 0.2);
      border-color: rgba(255, 42, 42, 0.4);
    }

    /* Make corners glow slightly */
    .ex-card::before,
    .ex-card::after {
      content: '';
      position: absolute;
      width: 15px;
      height: 15px;
      border: 2px solid var(--orange);
      opacity: 0.8;
      pointer-events: none;
      filter: drop-shadow(0 0 4px var(--orange));
    }

    .ex-card::before {
      top: -1px;
      left: -1px;
      border-right: 0;
      border-bottom: 0
    }

    .ex-card::after {
      bottom: -1px;
      right: -1px;
      border-left: 0;
      border-top: 0
    }

    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px
    }

    .ex-id {
      min-width: 0;
      flex: 1
    }

    .ex-id h3 {
      font-size: 13.5px;
      color: #fff;
      letter-spacing: .05em;
      line-height: 1.25
    }

    .ex-meta {
      font-size: 9.5px;
      color: var(--muted);
      letter-spacing: .09em;
      margin-top: 3px
    }

    .ex-target {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      flex: 0 0 auto;
    }

    .ex-target span {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--muted);
      letter-spacing: .16em
    }

    .ex-target em {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--dim);
      font-style: normal;
      letter-spacing: .14em
    }

    .load-in {
      width: 62px;
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--orange);
      font-size: 15px;
      font-weight: 700;
      text-align: right;
      padding: 3px 6px;
      outline: none;
    }

    .load-in:focus {
      border-color: var(--orange)
    }

    .best-badge {
      margin-top: 9px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .1em;
      color: var(--cyan);
      background: rgba(56, 189, 248, .08);
      border-left: 2px solid var(--cyan);
      padding: 5px 8px;
      border-radius: 2px;
    }

    .best-badge b {
      color: #fff
    }

    .cues {
      margin: 9px 0 10px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
      border-left: 2px solid var(--border);
      padding-left: 9px;
    }

    .tools {
      display: flex;
      gap: 10px;
      align-items: stretch;
      flex-wrap: wrap
    }

    .lbl {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .16em;
      color: var(--muted);
      display: block;
      margin-bottom: 5px
    }

    .plate-box {
      flex: 1 1 180px;
      min-width: 0
    }

    .plates {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
      min-height: 20px
    }

    .plate {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      padding: 2.5px 5px;
      border-radius: 2px;
      color: #0d1115;
      line-height: 1;
    }

    .plate[data-w="25"] {
      background: #e5534b;
      color: #fff
    }

    .plate[data-w="20"] {
      background: #38bdf8;
      color: #06202b
    }

    .plate[data-w="15"] {
      background: #f0a030;
      color: #241503
    }

    .plate[data-w="10"] {
      background: #3fb27f;
      color: #04231a
    }

    .plate[data-w="5"] {
      background: #dfe7ef;
      color: #111
    }

    .plate[data-w="2.5"] {
      background: #5a6b7d;
      color: #fff
    }

    .plate[data-w="1.25"] {
      background: #8b9aab;
      color: #111
    }

    .plate-total {
      font-size: 9px;
      color: var(--muted);
      margin-left: 3px
    }

    .rir-box {
      flex: 0 0 auto
    }

    .rir-sel {
      display: flex;
      gap: 3px
    }

    .rir-sel button {
      width: 30px;
      height: 25px;
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      border-radius: 2px;
      transition: .13s;
    }

    .rir-sel button.on {
      border-color: var(--orange);
      color: var(--orange);
      background: rgba(240, 160, 48, .14);
      box-shadow: 0 0 10px rgba(240, 160, 48, .2);
    }

    /* sets */
    .sets {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .set-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px
    }

    .set-btn {
      width: 42px;
      height: 38px;
      border-radius: 3px;
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      transition: .14s;
      display: grid;
      place-items: center;
    }

    .set-btn:active {
      transform: scale(.94)
    }

    .set-item.done .set-btn {
      border-color: var(--green);
      color: #0d1115;
      background: var(--green);
      box-shadow: 0 0 12px rgba(63, 178, 127, .35);
    }

    .reps-in {
      width: 42px;
      background: transparent;
      border: 1px solid transparent;
      border-bottom: 1px solid var(--border);
      color: var(--txt);
      font-size: 11px;
      text-align: center;
      padding: 2px 0;
      outline: none;
    }

    .reps-in:focus {
      border-bottom-color: var(--orange);
      color: var(--orange)
    }

    .overload {
      margin-top: 11px;
      display: flex;
      gap: 7px;
      align-items: flex-start;
      background: rgba(240, 160, 48, .1);
      border: 1px solid rgba(240, 160, 48, .45);
      color: var(--orange);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .06em;
      padding: 8px 10px;
      border-radius: 2px;
      line-height: 1.5;
    }

    .overload b {
      color: #fff
    }

    /* ============================================================
   REST TIMER
   ============================================================ */
    /* ============================================================
   FULLSCREEN REST TIMER
   ============================================================ */
    .fullscreen-timer {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 8, 11, 0.98);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .fullscreen-timer.show {
      display: flex;
      opacity: 1;
    }

    .timer-container {
      position: relative;
      width: 280px;
      height: 280px;
    }

    .timer-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-track {
      fill: none;
      stroke: #1b242d;
      stroke-width: 8;
    }

    .timer-progress {
      fill: none;
      stroke: var(--orange);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.2s linear;
      filter: drop-shadow(0 0 12px var(--orange));
    }

    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 42, 42, 0.5);
    }

    .timer-controls {
      margin-top: 40px;
    }

    .rest-preset-btn {
      background: transparent;
      border: 1px solid var(--muted);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 14px;
      transition: 0.2s;
    }

    .rest-preset-btn:active,
    .rest-preset-btn.on {
      border-color: var(--orange);
      color: var(--orange);
      box-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
    }

    .rest-skip-btn {
      background: transparent;
      border: 2px solid var(--orange);
      color: var(--orange);
      padding: 12px 30px;
      border-radius: 30px;
      font-family: var(--head);
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .rest-skip-btn:active {
      background: var(--orange);
      color: #000;
    }

    #restBar.show {
      transform: translateY(0);
      pointer-events: auto
    }

    .rest-inner {
      max-width: 820px;
      margin: 0 auto;
      background: linear-gradient(180deg, #1b232b, #131920);
      border: 1px solid var(--orange);
      border-radius: 5px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .6), 0 0 0 1px rgba(240, 160, 48, .18);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .rest-clock {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: .03em;
      min-width: 74px;
      text-shadow: 0 0 14px rgba(240, 160, 48, .45);
    }

    .rest-presets {
      display: flex;
      gap: 4px;
      flex: 1;
      flex-wrap: wrap
    }

    .rest-presets button {
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9.5px;
      padding: 5px 7px;
      border-radius: 2px;
    }

    .rest-presets button.on {
      border-color: var(--orange);
      color: var(--orange)
    }

    .rest-skip {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
      font-family: var(--mono);
      font-size: 9.5px;
      padding: 6px 9px;
      border-radius: 2px;
      letter-spacing: .1em;
    }

    #restBar.ringing .rest-inner {
      animation: ring .6s ease-in-out infinite
    }

    @keyframes ring {

      0%,
      100% {
        border-color: var(--orange)
      }

      50% {
        border-color: #fff;
        box-shadow: 0 0 26px rgba(240, 160, 48, .7)
      }
    }

    /* ============================================================
   BOTTOM NAV
   ============================================================ */
    nav#tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
    }

    nav#tabs button {
      background: none;
      border: 0;
      color: var(--muted);
      font-family: var(--head);
      font-size: 9px;
      letter-spacing: .1em;
      padding: 12px 2px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    nav#tabs button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      transition: transform 0.3s ease;
    }

    nav#tabs button.active {
      color: var(--orange);
      text-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
    }

    nav#tabs button.active svg {
      transform: translateY(-2px) scale(1.1);
      filter: drop-shadow(0 0 8px var(--orange));
    }

    nav#tabs button.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      background: var(--orange);
      border-radius: 0 0 4px 4px;
      box-shadow: 0 0 15px var(--orange);
    }

    /* ============================================================
   REFUEL
   ============================================================ */
    .date-nav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 7px;
      align-items: center;
    }

    .date-nav button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--txt);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
      padding: 10px 10px;
      border-radius: 3px;
    }

    .date-nav button:active {
      border-color: var(--orange);
      color: var(--orange)
    }

    .date-nav input[type=date] {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--txt);
      font-family: var(--mono);
      font-size: 11px;
      padding: 9px 8px;
      border-radius: 3px;
      width: 100%;
      text-align: center;
      outline: none;
      color-scheme: dark;
    }

    .date-nav input[type=date]:focus {
      border-color: var(--orange)
    }

    .ring-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: center;
      padding: 6px 0
    }

    .ring-box {
      position: relative;
      width: 150px;
      height: 150px;
      flex: 0 0 150px
    }

    .ring {
      width: 150px;
      height: 150px;
      transform: rotate(-90deg)
    }

    .ring-bg {
      fill: none;
      stroke: #1b242d;
      stroke-width: 9
    }

    .ring-fg {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 9;
      stroke-linecap: round;
      transition: stroke-dashoffset .6s cubic-bezier(.2, .9, .3, 1);
      filter: drop-shadow(0 0 6px rgba(240, 160, 48, .5));
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .ring-center .big {
      font-family: var(--mono);
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      text-shadow: 0 0 20px rgba(255, 42, 42, 0.6);
      /* Red glow on main numbers */
    }

    .ring-center .of {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .13em;
      margin-top: 2px
    }

    .ring-center .kcal {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--cyan);
      margin-top: 6px
    }

    .ring-stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 0
    }

    .stat-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .06em;
      border-bottom: 1px dashed #1d2731;
      padding-bottom: 5px
    }

    .stat-line b {
      color: var(--txt);
      font-weight: 700
    }

    .stat-line b.ok {
      color: var(--green)
    }

    .stat-line b.bad {
      color: var(--red)
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px
    }

    .mcell {
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .mcell .d {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--dim);
      letter-spacing: .08em
    }

    .mcell .v {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted)
    }

    .mcell.hit {
      border-color: var(--green);
      background: rgba(63, 178, 127, .11)
    }

    .mcell.hit .v {
      color: var(--green)
    }

    .mcell.today {
      box-shadow: inset 0 0 0 1px var(--orange)
    }

    .mcell.today .d {
      color: var(--orange)
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px
    }

    .qbtn {
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 9px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      color: var(--txt);
      text-align: left;
      transition: .13s;
    }

    .qbtn:active {
      border-color: var(--orange);
      background: rgba(240, 160, 48, .1)
    }

    .qbtn .qn {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.25
    }

    .qbtn .qp {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      flex: 0 0 auto
    }

    .meal {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dashed #1d2731;
    }

    .meal:last-child {
      border-bottom: 0
    }

    .meal .mn {
      font-size: 12px;
      font-weight: 500;
      color: #fff
    }

    .meal .mb {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.4
    }

    .meal .mv {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green);
      white-space: nowrap;
      text-align: right
    }

    .meal .mv em {
      display: block;
      font-style: normal;
      color: var(--cyan);
      font-size: 9.5px
    }

    .del {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dim);
      width: 24px;
      height: 24px;
      border-radius: 2px;
      font-size: 12px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .del:active {
      border-color: var(--red);
      color: var(--red)
    }

    .scan-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(240, 160, 48, .16), rgba(240, 160, 48, .05));
      border: 1px solid var(--orange);
      color: var(--orange);
      font-family: var(--head);
      font-size: 12px;
      letter-spacing: .14em;
      padding: 13px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .scan-btn:active {
      background: rgba(240, 160, 48, .28)
    }

    .scan-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8
    }

    .scan-result {
      border-radius: 4px;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid
    }

    .scan-result.ok {
      border-color: var(--green);
      background: rgba(63, 178, 127, .09)
    }

    .scan-result.bad {
      border-color: var(--red);
      background: rgba(229, 83, 75, .09)
    }

    .scan-result.load {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, .07)
    }

    .scan-result h4 {
      font-size: 12px;
      margin-bottom: 5px
    }

    .scan-result.ok h4 {
      color: var(--green)
    }

    .scan-result.bad h4 {
      color: var(--red)
    }

    .scan-result.load h4 {
      color: var(--cyan)
    }

    .scan-macros {
      display: flex;
      gap: 14px;
      margin: 8px 0;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700
    }

    .scan-macros .p {
      color: var(--green)
    }

    .scan-macros .c {
      color: var(--cyan)
    }

    .confirm-btn {
      width: 100%;
      margin-top: 9px;
      background: var(--green);
      border: 0;
      color: #07130e;
      font-family: var(--head);
      font-size: 12px;
      letter-spacing: .14em;
      font-weight: 700;
      padding: 12px;
      border-radius: 3px;
    }

    .confirm-btn:active {
      filter: brightness(.88)
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(56, 189, 248, .3);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: inline-block;
      vertical-align: -3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .manual {
      display: grid;
      grid-template-columns: 1fr 56px 62px auto;
      gap: 6px
    }

    .manual input {
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--txt);
      font-size: 11.5px;
      padding: 9px 8px;
      border-radius: 3px;
      outline: none;
      min-width: 0;
    }

    .manual input:focus {
      border-color: var(--orange)
    }

    .manual button {
      background: #0a0e12;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 10px;
      padding: 0 10px;
      border-radius: 3px;
      letter-spacing: .08em;
    }

    /* ============================================================
   VAULT
   ============================================================ */
    .ms-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 11px;
      margin-top: 4px
    }

    .ms-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 9px
    }

    .ms-head h3 {
      font-size: 12px;
      color: #fff
    }

    .ms-head span {
      font-family: var(--mono);
      font-size: 8.5px;
      color: var(--muted);
      letter-spacing: .14em
    }

    .ms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px
    }

    .photo-slot {
      aspect-ratio: 3/4;
      background: #0a0e12;
      border: 1px dashed var(--border);
      border-radius: 3px;
      overflow: hidden;
      padding: 0;
      display: grid;
      place-items: center;
      position: relative;
    }

    .photo-slot:active {
      border-color: var(--orange)
    }

    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .ph-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--dim)
    }

    .ph-empty span {
      font-size: 18px;
      line-height: 1
    }

    .ph-empty em {
      font-style: normal;
      font-family: var(--mono);
      font-size: 7.5px;
      letter-spacing: .14em;
      color: var(--muted);
    }

    .cmp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 11px
    }

    .cmp-slot {
      aspect-ratio: 3/4;
      background: #0a0e12;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
    }

    .cmp-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .cmp-slot .tag {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 17, 21, .85);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .12em;
      padding: 4px;
      text-align: center;
      color: var(--orange);
    }

    .sel-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 10px
    }

    .sel-row select {
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--txt);
      font-family: var(--mono);
      font-size: 10px;
      padding: 9px 6px;
      border-radius: 3px;
      outline: none;
      width: 100%;
    }

    .sel-row select:focus {
      border-color: var(--orange)
    }

    /* ============================================================
   BLUEPRINT DECK
   ============================================================ */
    .bp-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px
    }

    .bp-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0;
      overflow: hidden;
      position: relative;
      display: block;
      text-align: left;
      transition: .15s;
    }

    .bp-card:active {
      border-color: var(--orange);
      transform: scale(.98)
    }

    .bp-img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3/4;
      object-fit: cover;
      object-position: top;
    }

    .bp-label {
      display: block;
      font-family: var(--head);
      font-size: 9px;
      letter-spacing: .1em;
      color: var(--muted);
      padding: 7px 9px;
      border-top: 1px solid var(--border);
      text-transform: uppercase;
      text-align: center;
    }

    .bp-card.full-width {
      grid-column: 1 / -1;
    }

    .bp-card.full-width .bp-img {
      aspect-ratio: auto;
      max-height: 300px;
      object-fit: cover;
      object-position: center;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(5, 8, 11, .97);
      display: none;
      flex-direction: column;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .lightbox.open {
      display: flex
    }

    .lb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      padding-top: calc(12px + env(safe-area-inset-top));
    }

    .lb-bar span {
      font-size: 10px;
      letter-spacing: .14em;
      color: var(--orange)
    }

    .lb-btns {
      display: flex;
      gap: 5px
    }

    .lb-btns button {
      width: 34px;
      height: 34px;
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--txt);
      border-radius: 3px;
      font-size: 14px;
      line-height: 1;
      display: grid;
      place-items: center;
    }

    .lb-btns button:active {
      border-color: var(--orange);
      color: var(--orange)
    }

    .lb-stage {
      flex: 1;
      overflow: hidden;
      position: relative;
      touch-action: none;
      display: grid;
      place-items: center;
      cursor: grab;
    }

    .lb-stage:active {
      cursor: grabbing
    }

    .lb-content {
      width: min(92vw, 600px);
      max-height: 100%;
      transform-origin: center center;
      transition: transform .12s ease-out;
      will-change: transform;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lb-content img {
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .lb-hint {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: .14em;
      color: var(--dim);
      pointer-events: none;
    }

    /* ============================================================
   SYSTEM
   ============================================================ */
    .sys-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px dashed #1d2731;
      font-size: 12px;
    }

    .sys-row:last-child {
      border-bottom: 0
    }

    .sys-row .v {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--orange)
    }

    .act-btn {
      width: 100%;
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--txt);
      font-family: var(--head);
      font-size: 11px;
      letter-spacing: .13em;
      padding: 13px;
      border-radius: 3px;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .act-btn:active {
      border-color: var(--orange);
      color: var(--orange)
    }

    .act-btn.danger {
      border-color: rgba(229, 83, 75, .5);
      color: var(--red)
    }

    .act-btn.primary {
      border-color: var(--cyan);
      color: var(--cyan)
    }

    /* ============================================================
   TOAST
   ============================================================ */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + 86px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      z-index: 300;
      background: #1b232b;
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      color: var(--txt);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .08em;
      padding: 10px 16px;
      border-radius: 3px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      max-width: 88vw;
      text-align: center;
      box-shadow: 0 8px 26px rgba(0, 0, 0, .65);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .toast.green {
      border-left-color: var(--green);
      color: var(--green)
    }

    .toast.red {
      border-left-color: var(--red);
      color: var(--red)
    }

    .toast.cyan {
      border-left-color: var(--cyan);
      color: var(--cyan)
    }

    @media(min-width:640px) {
      .quick-grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .bp-grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .ms-grid {
        grid-template-columns: repeat(3, 1fr)
      }
    }

    /* ============================================================
   CUSTOM CALENDAR
   ============================================================ */
    .cal-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(255, 42, 42, 0.05);
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .cal-header button {
      background: #0a0e12;
      border: 1px solid var(--border);
      color: var(--txt);
      width: 36px;
      height: 36px;
      border-radius: 3px;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .cal-header button:active {
      border-color: var(--orange);
      color: var(--orange);
    }

    .cal-month-year {
      font-family: var(--head);
      font-size: 16px;
      color: #fff;
      letter-spacing: 0.1em;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 50%;
      color: var(--txt);
      font-family: var(--mono);
      font-size: 13px;
      position: relative;
      transition: all 0.2s;
    }

    .cal-day:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .cal-day.empty {
      pointer-events: none;
    }

    .cal-day.today {
      color: var(--orange);
      border-color: var(--orange);
      font-weight: bold;
    }

    .cal-day.selected {
      background: var(--orange);
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 42, 42, 0.4);
    }

    /* Dot indicator for days with logged workouts */
    .cal-day.has-log::after {
      content: '';
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--cyan);
    }

    .cal-day.selected.has-log::after {
      background: #000;
    }

    .cal-today-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--txt);
      font-family: var(--head);
      font-size: 12px;
      letter-spacing: 0.1em;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .cal-today-btn:active {
      border-color: var(--orange);
      color: var(--orange);
    }

    /* FULL SCREEN GRAIN TEXTURE */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid var(--orange);
      box-shadow: 0 0 10px rgba(255, 42, 42, 0.4);
      background: #000;
    }

            e.target.result.createObjectStore(STORE_NAME);
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e.target.error);

          }

            const tx = dbInstance.transaction(STORE_NAME, "readonly");
            const req = tx.objectStore(STORE_NAME).get(DB_KEY);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);

            { time: "16:30", name: "Snack", desc: "Banana + njugu.", p: 8, cal: 220 },
            { time: "20:00", name: "Heavy Supper", desc: "Spaghetti + Boiled/Fried Eggs + tomato sauce.", p: 21, cal: 580 },
            { time: "22:00", name: "Bedtime Recovery", desc: "1 glass fresh milk.", p: 16, cal: 300 }
          ], totalP: 73, totalCal: 1550
        },
        sun: {
          label: "SUNDAY", focus: "PREP",
          meals: [
            { time: "09:00", name: "Heavy Breakfast", desc: "Rice + Ndengu + milky chai.", p: 36, cal: 680 },
            { time: "16:30", name: "Snack", desc: "Banana + njugu.", p: 8, cal: 220 },
            { time: "20:00", name: "Heavy Supper", desc: "Ugali + Omena + Greens.", p: 68, cal: 880 }
          ], totalP: 112, totalCal: 1780
        }
      };

      const MILESTONES = [
        { k: "w0", label: "WEEK 0", sub: "BASELINE" },
        { k: "w2", label: "WEEK 2", sub: "CHECKPOINT" },
        { k: "w4", label: "WEEK 4", sub: "MID-PHASE" },
        { k: "w6", label: "WEEK 6", sub: "CHECKPOINT" },
        { k: "w8", label: "WEEK 8", sub: "FINAL" }
      ];
      const POSES = ["front", "side", "back"];

      const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
      const BAR_WEIGHT = 20;

      /* The new image blueprints */
      const BLUEPRINTS = [
        { key: "mon", label: "Monday: Upper A", src: "/images/mon.jpg" },
        { key: "tue", label: "Tuesday: Lower A", src: "/images/tue.jpg" },
        { key: "wed", label: "Wednesday: Recovery", src: "/images/wed.jpg" },
        { key: "thu", label: "Thursday: Upper B", src: "/images/thu.jpg" },
        { key: "fri", label: "Friday: Lower B", src: "/images/fri.jpg" },
        { key: "weekend", label: "Sat & Sun: Recovery & Prep", src: "/images/weekend.jpg" },
        { key: "overview", label: "The Complete Operator Split", src: "/images/overview.jpg", full: true }
      ];

      /* ---------------------------------------------------------------------------
         PERSISTENCE — multi-key migration
         --------------------------------------------------------------------------- */
      function blankDB() {
        return {
          version: 3,
          created: Date.now(),
          settings: { proteinTarget: 105, operator: "OPERATOR" },
          logs: {},
          workouts: {},
          history: {},
          photos: {},
          favorites: [],
          weightLog: [],
        };
      }

      function migrate(raw) {
        const db = blankDB();
        if (!raw || typeof raw !== "object") return db;

        /* ---- settings ---- */
        const s = raw.settings || raw.config || raw.prefs || {};
        db.settings.proteinTarget = num(s.proteinTarget != null ? s.proteinTarget : raw.proteinTarget, 105) || 105;
        db.settings.operator = s.operator || s.name || "OPERATOR";
        if (raw.proteinTarget && !s.proteinTarget) db.settings.proteinTarget = num(raw.proteinTarget, 105) || 105;

        /* ---- nutrition logs ---- */
        const rawLogs = raw.logs || raw.nutrition || raw.meals || raw.food || raw.diary || {};
        if (Array.isArray(rawLogs)) {
          db.logs[ymd()] = { meals: normaliseMeals(rawLogs) };
        } else if (rawLogs && typeof rawLogs === "object") {
          Object.keys(rawLogs).forEach((k) => {
            const v = rawLogs[k];
            if (Array.isArray(v)) {
              db.logs[k] = { meals: normaliseMeals(v), water: 0 };
            } else if (v && typeof v === "object") {
              db.logs[k] = {
                meals: normaliseMeals(v.meals || v.items || []),
                water: v.water || 0 // <--- PRESERVE WATER
              };
            }
          });
        }

        /* ---- workouts ---- */
        const rawW = raw.workouts || raw.sessions || raw.training || raw.exercises || {};
        if (rawW && typeof rawW === "object") {
          Object.keys(rawW).forEach((k) => {
            const v = rawW[k] || {};
            const ex = v.ex || v.exercises || v.data || {};
            db.workouts[k] = { ex: (ex && typeof ex === "object") ? ex : {} };
          });
        }

        /* ---- history / PRs ---- */
        const rawH = raw.history || raw.bests || raw.prs || raw.records || {};
        if (rawH && typeof rawH === "object") {
          Object.keys(rawH).forEach((k) => {
            const v = rawH[k];
            if (v == null) return;
            if (typeof v === "number") {
              db.history[k] = { weight: v, reps: null, date: null };
            } else if (typeof v === "object") {
              db.history[k] = {
                weight: num(v.weight != null ? v.weight : v.w, 0),
                reps: v.reps != null ? num(v.reps, null) : null,
                date: v.date || v.at || null
              };
            }
          });
        }

        /* ---- photos ---- */
        const rawP = raw.photos || raw.vault || raw.milestones || raw.progress || {};
        if (rawP && typeof rawP === "object") {
          Object.keys(rawP).forEach((k) => {
            const v = rawP[k];
            if (!v || typeof v !== "object") return;
            db.photos[k] = {
              front: v.front || v.f || null,
              side: v.side || v.s || null,
              back: v.back || v.b || null
            };
          });
        }
        /* ---- favorites & weightLog ---- */
        if (Array.isArray(raw.favorites)) db.favorites = raw.favorites;
        if (Array.isArray(raw.weightLog)) db.weightLog = raw.weightLog;

        /* ---- Fix Orphaned IDs ---- */
        const idMap = {
          "calf": "calfA", "calfB": "calfB", // legacy 'calf' maps to new 'calfA'
          "legcurl": "legcurlA", "legcurlB": "legcurlB",
          "walk": "walkA", "walkB": "walkB",
          "stretch": "stretchA", "stretchB": "stretchB"
        };

        if (db.history) {
          Object.keys(idMap).forEach(oldId => {
            if (db.history[oldId]) {
              db.history[idMap[oldId]] = db.history[oldId];
              delete db.history[oldId];
            }
          });
        }
        db.version = 3;
        return db;
      }

      function normaliseMeals(arr) {
        if (!Array.isArray(arr)) return [];
        return arr.map((m) => ({
          id: m.id || uid(),
          name: String(m.name || m.title || "Meal").slice(0, 90),
          p: num(m.p != null ? m.p : m.protein, 0),
          cal: num(m.cal != null ? m.cal : (m.kcal != null ? m.kcal : m.calories), 0),
          breakdown: String(m.breakdown || m.notes || "").slice(0, 240),
          img: m.img || m.image || null, // <--- ADD THIS
          at: m.at || m.time || Date.now()
        }));
      }

      /* ---------------------------------------------------------------------------
   GLOBAL STATE
   --------------------------------------------------------------------------- */
      const state = {
        tab: "mission",
        refuelView: "log",
        planDay: "mon",
        dayKey: todayDayKey(),
        missionDate: ymd(),
        nutDate: ymd(),
        scan: { status: "idle" },
        photoTarget: null,
        cmpA: "w0",
        cmpB: "w8",
        cmpPose: "front",
        bpKey: null,
        calTarget: null,
        calMonth: new Date().getMonth(),
        calYear: new Date().getFullYear()
      };

      function todayDayKey() {
        const map = { 1: "upperA", 2: "lowerA", 3: "recoveryA", 4: "upperB", 5: "lowerB", 6: "recoveryB", 0: "recoveryB" };
        return map[new Date().getDay()];
      }

      function getDay(key) {
        return TRAINING.filter((d) => d.key === key)[0] || TRAINING[0];
      }

      /* ---------------------------------------------------------------------------
         SESSION HELPERS
         --------------------------------------------------------------------------- */
      function getSession(db, dayKey, dateKey, createIfMissing = false) {
        const k = dayKey + "::" + dateKey;
        if (createIfMissing) {
          if (!db.workouts[k]) db.workouts[k] = { ex: {} };
        }
        if (!db.workouts[k]) return { ex: {} }; // Return ephemeral session if not creating
        if (!db.workouts[k].ex) db.workouts[k].ex = {};
        return db.workouts[k];
      }

      function getExState(session, ex, db) {
        let s = session.ex[ex.id];
        if (!s || typeof s !== "object") {
          // AUTO-PROGRESSION: Check if previous history weight is higher
          let defaultWeight = ex.weight;
          if (db && db.history && db.history[ex.id] && db.history[ex.id].weight > ex.weight) {
            defaultWeight = db.history[ex.id].weight;
          }
          s = { sets: [], reps: [], rir: 2, weight: defaultWeight };
          session.ex[ex.id] = s;
        }
        if (!Array.isArray(s.sets)) s.sets = [];
        if (!Array.isArray(s.reps)) s.reps = [];
        while (s.sets.length < ex.sets) { s.sets.push(false); s.reps.push(ex.max); }
        while (s.reps.length < ex.sets) s.reps.push(ex.max);
        if (s.rir === undefined || s.rir === null) s.rir = 2;
        if (s.weight === undefined || s.weight === null) s.weight = ex.weight;
        return s;
      }

      /* ---------------------------------------------------------------------------
         PLATE MATH
         --------------------------------------------------------------------------- */
      function platesFor(total) {
        const t = num(total, 0);
        if (t <= BAR_WEIGHT) return { list: [], note: "EMPTY BAR · 20KG" };
        let perSide = (t - BAR_WEIGHT) / 2;
        const list = [];
        for (let i = 0; i < PLATES.length; i++) {
          const p = PLATES[i];
          while (perSide >= p - 0.001) { list.push(p); perSide -= p; }
        }
        return { list: list, note: perSide > 0.02 ? "CLOSEST LOADABLE" : "" };
      }

      function plateHTML(res) {
        if (!res.list.length) return '<span class="mono" style="font-size:9px;color:var(--dim)">' + esc(res.note) + "</span>";
        const perSide = res.list.reduce((a, b) => a + b, 0);
        return res.list.map((p) => '<span class="plate" data-w="' + p + '">' + p + "</span>").join("") +
          '<span class="mono plate-total">' + perSide + "kg / SIDE</span>";
      }

      /* ---------------------------------------------------------------------------
         VIEW: MISSION
         --------------------------------------------------------------------------- */
      function viewMission(db) {
        const dateKey = state.missionDate || ymd();
        const day = getDay(state.dayKey);
        const session = getSession(db, day.key, dateKey);

        let totalSets = 0, doneSets = 0;
        day.exercises.forEach((ex) => {
          const s = getExState(session, ex, db);
          totalSets += ex.sets;
          doneSets += s.sets.filter(Boolean).length;
        });
        const pct = totalSets ? Math.round((doneSets / totalSets) * 100) : 0;

        const pills = TRAINING.map((d) =>
          '<button class="day-pill ' + (d.key === day.key ? "on" : "") +
          '" data-act="pick-day" data-key="' + d.key + '"><b>' + d.tag + "</b><span>" + d.short + "</span></button>"
        ).join("");

        const cards = day.exercises.map((ex) => exCardHTML(db, session, ex)).join("");

        return (
          '<section class="pad">' +
          '<div class="day-strip">' + pills + "</div>" +
          '<div class="card">' +
          '<div class="row between">' +
          "<div>" +
          '<div class="kicker" style="display:flex; align-items:center; justify-content:space-between;">' +
          day.tag + " · " + dateKey +
          '<button class="mono" data-act="open-calendar" data-target="mission" data-date="' + dateKey + '" style="background:transparent; border:1px solid var(--border); color:var(--muted); padding:4px 8px; border-radius:4px; font-size:10px;">' + dateKey + ' 📅</button>' +
          '</div>' +
          '<h2 class="day-title">' + esc(day.name) + "</h2>" +
          '<div class="focus">' + esc(day.focus) + "</div>" +
          "</div>" +
          '<div style="text-align:right">' +
          '<div class="mono" style="font-size:22px;font-weight:700;color:var(--orange)">' + pct + "%</div>" +
          '<div class="mono" style="font-size:8px;color:var(--muted);letter-spacing:.14em">COMPLETE</div>' +
          "</div>" +
          "</div>" +
          '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
          '<div class="row between mono small dim"><span>' + doneSets + " / " + totalSets + " SETS</span><span>" +
          (pct === 100 ? "SESSION COMPLETE ✓" : "IN PROGRESS") + "</span></div>" +
          "</div>" +
          cards +
          "</section>"
        );
      }

      function exCardHTML(db, session, ex) {
        const s = getExState(session, ex, db);
        const best = db.history[ex.id];
        const allDone = s.sets.every(Boolean) && s.sets.length > 0;
        const overload = allDone && s.reps.every((r) => num(r, 0) >= ex.max);
        const target = num(s.weight, 0) + ex.inc;

        const bestHTML = best
          ? '<div class="best-badge">◈ PREVIOUS BEST <b>' + best.weight + "KG</b>" +
          (best.reps != null ? " × " + best.reps : "") +
          (best.date ? " · " + esc(best.date) : "") + "</div>"
          : "";

        const setsHTML = s.sets.map((on, i) =>
          '<div class="set-item ' + (on ? "done" : "") + '">' +
          '<button class="set-btn" data-act="toggle-set" data-ex="' + ex.id + '" data-i="' + i + '">' +
          (on ? "✓" : (i + 1)) +
          "</button>" +
          '<input class="reps-in mono" type="number" inputmode="numeric" min="0" max="99" ' +
          'value="' + s.reps[i] + '" data-act="ex-reps" data-ex="' + ex.id + '" data-i="' + i + '" />' +
          "</div>"
        ).join("");

        const rirHTML = [2, 1, 0].map((v) =>
          '<button class="' + (num(s.rir) === v ? "on" : "") + '" data-act="set-rir" data-ex="' +
          ex.id + '" data-v="' + v + '">' + v + "</button>"
        ).join("");

        return (
          '<article class="ex-card" id="card-' + ex.id + '">' +
          '<div class="ex-top">' +
          '<div class="ex-id">' +
          '<h3 data-act="open-history" data-ex="' + ex.id + '" style="cursor:pointer; border-bottom:1px dashed var(--border); display:inline-block;">' + esc(ex.name) + '</h3>' +
          '<div class="ex-meta">' + ex.sets + " × " + ex.min + "–" + ex.max +
          (ex.recovery ? " REPS/MIN" : " REPS") + " · REST " + fmtRest(ex.rest) + "</div>" +
          "</div>" +
          '<div class="ex-target">' +
          "<span>LOAD</span>" +
          '<input class="load-in mono" type="number" step="2.5" value="' + s.weight +
          '" data-act="ex-weight" data-ex="' + ex.id + '" />' +
          "<em>KG</em>" +
          "</div>" +
          "</div>" +
          bestHTML +
          '<p class="cues">' + esc(ex.cues) + "</p>" +
          '<div class="tools">' +
          (ex.equipment === 'barbell' ?
            '<div class="plate-box">' +
            '<span class="lbl">PLATE CALC · 20KG BAR</span>' +
            '<div class="plates" id="plates-' + ex.id + '">' + plateHTML(platesFor(s.weight)) + "</div>" +
            "</div>"
            : '') +
          '<div class="rir-box">' +
          '<span class="lbl">RIR</span>' +
          '<div class="rir-sel">' + rirHTML + "</div>" +
          "</div>" +
          "</div>" +
          '<div class="sets" id="sets-' + ex.id + '">' + setsHTML + "</div>" +
          '<div class="overload" id="ovl-' + ex.id + '" style="display:' + (overload ? "flex" : "none") + '">' +
          "⚠ OVERLOAD DETECTED — ALL SETS AT " + ex.max + " REPS. UNLOCK <b>" +
          (ex.inc > 0 ? target + "KG" : "PROGRESSION") + "</b> NEXT WEEK." +
          "</div>" +
          "</article>"
        );
      }

      /* targeted refresh (no full re-render — keeps input focus) */
      function refreshCard(db, session, ex) {
        const s = getExState(session, ex, db);
        const plateBox = document.getElementById("plates-" + ex.id);
        if (plateBox) plateBox.innerHTML = plateHTML(platesFor(s.weight));

        const ovl = document.getElementById("ovl-" + ex.id);
        if (ovl) {
          const allDone = s.sets.every(Boolean) && s.sets.length > 0;
          const overload = allDone && s.reps.every((r) => num(r, 0) >= ex.max);
          ovl.style.display = overload ? "flex" : "none";
          if (overload) {
            const target = num(s.weight, 0) + ex.inc;
            ovl.innerHTML = "⚠ OVERLOAD DETECTED — ALL SETS AT " + ex.max + " REPS. UNLOCK <b>" +
              (ex.inc > 0 ? target + "KG" : "PROGRESSION") + "</b> NEXT WEEK.";
          }
        }
      }

      /* ---------------------------------------------------------------------------
         VIEW: REFUEL
         --------------------------------------------------------------------------- */
      function dayProtein(db, key) {
        const l = db.logs[key];
        if (!l || !Array.isArray(l.meals)) return 0;
        return l.meals.reduce((a, m) => a + num(m.p, 0), 0);
      }
      function dayCal(db, key) {
        const l = db.logs[key];
        if (!l || !Array.isArray(l.meals)) return 0;
        return l.meals.reduce((a, m) => a + num(m.cal, 0), 0);
      }
      function viewMealPlan() {
        const day = MEAL_PLAN[state.planDay] || MEAL_PLAN.mon;

        const dayPills = Object.keys(MEAL_PLAN).map((k) => {
          const d = MEAL_PLAN[k];
          return '<button class="day-pill ' + (state.planDay === k ? 'on' : '') + '" data-act="plan-day" data-key="' + k + '">' +
            '<b>' + d.label.substring(0, 3) + '</b><span>' + d.focus.split(' ')[0] + '</span></button>';
        }).join('');

        const mealCards = day.meals.map(m =>
          '<div class="card" style="padding:12px; margin-top:8px; border-left:3px solid var(--orange);">' +
          '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">' +
          '<div style="font-family:var(--head); font-size:12px; color:#fff;">' + m.name + '</div>' +
          '<div class="mono" style="font-size:9px; color:var(--muted);">' + m.time + '</div>' +
          '</div>' +
          '<div style="font-size:11.5px; color:var(--muted); line-height:1.4; margin-bottom:10px;">' + esc(m.desc) + '</div>' +
          '<div style="display:flex; gap:12px;">' +
          '<div class="mono" style="font-size:11px; color:var(--green); font-weight:700;">+' + m.p + 'g P</div>' +
          '<div class="mono" style="font-size:11px; color:var(--cyan); font-weight:700;">+' + m.cal + ' kcal</div>' +
          '</div>' +
          '</div>'
        ).join('');

        return (
          '<div style="margin-top:10px;">' +
          '<div class="day-strip" style="margin-bottom:12px;">' + dayPills + '</div>' +

          '<div class="card">' +
          '<div class="row between">' +
          '<div>' +
          '<div class="kicker">DAILY TARGET PROTOCOL</div>' +
          '<h2 class="day-title">' + day.label + '</h2>' +
          '<div class="focus">' + day.focus + '</div>' +
          '</div>' +
          '<div style="text-align:right">' +
          '<div class="mono" style="font-size:20px; font-weight:700; color:var(--green);">' + day.totalP + 'g</div>' +
          '<div class="mono" style="font-size:8px; color:var(--muted); letter-spacing:.14em;">PROTEIN</div>' +
          '<div class="mono" style="font-size:10px; color:var(--cyan); margin-top:2px;">' + day.totalCal + ' kcal</div>' +
          '</div>' +
          '</div>' +
          '</div>' +

          '<div class="kicker" style="margin-top:16px; margin-bottom:4px;">MEAL TIMELINE</div>' +
          mealCards +
          '</div>'
        );
      }

      function viewRefuel(db) {
        const key = state.nutDate;
        const log = db.logs[key] || { meals: [] };
        const meals = Array.isArray(log.meals) ? log.meals : [];
        const target = num(db.settings.proteinTarget, 105) || 105;
        const p = meals.reduce((a, m) => a + num(m.p, 0), 0);
        const cal = meals.reduce((a, m) => a + num(m.cal, 0), 0);
        const pct = Math.max(0, Math.min(1, p / target));

        const R = 52;
        const C = 2 * Math.PI * R;
        const offset = C * (1 - pct);

        /* 7-day rolling matrix ending on selected date */
        let matrix = "";
        for (let i = 6; i >= 0; i--) {
          const k = addDays(key, -i);
          const v = dayProtein(db, k);
          const hit = v >= target;
          matrix += '<div class="mcell ' + (hit ? "hit " : "") + (k === ymd() ? "today" : "") + '">' +
            '<span class="d">' + dayLetter(k) + "</span>" +
            '<span class="v">' + Math.round(v) + "</span></div>";
        }

        const favs = db.favorites || [];
        const quick = STAPLES.concat(favs).map((s) =>
          '<button class="qbtn" data-act="quick-add" data-name="' + esc(s.name) +
          '" data-p="' + s.p + '" data-cal="' + s.cal + '">' +
          '<span class="qn">' + esc(s.name) + '</span>' +
          '<span class="qp">+' + s.p + "g</span>" +
          "</button>"
        ).join("");

        const mealList = meals.length
          ? meals.map((m) =>
            '<div class="meal">' +
            '<div style="display:flex; align-items:center; gap:10px; min-width:0">' +
            (m.img ? '<img src="' + m.img + '" style="width:38px; height:38px; border-radius:4px; object-fit:cover; border:1px solid var(--border); flex-shrink:0;" />' : '') +
            '<div style="min-width:0">' +
            '<div class="mn">' + esc(m.name) + "</div>" +
            (m.breakdown ? '<div class="mb">' + esc(m.breakdown) + "</div>" : "") +
            "</div>" +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:9px; flex-shrink:0;">' +
            '<div class="mv">+' + num(m.p, 0) + "g<em>" + num(m.cal, 0) + " kcal</em></div>" +
            '<button class="del" data-act="del-meal" data-id="' + m.id + '">✕</button>' +
            "</div>" +
            "</div>"
          ).join("")
          : '<div class="dim" style="font-size:11.5px;padding:8px 0">NO MEALS LOGGED FOR THIS DATE.</div>';

        return (
          '<section class="pad">' +
          '<div style="display:flex; gap:6px; margin-bottom:4px;">' +
          '<button class="' + (state.refuelView === 'log' ? 'act-btn primary' : 'act-btn') + '" data-act="refuel-toggle" data-view="log" style="margin:0; padding:10px;">DAILY LOG</button>' +
          '<button class="' + (state.refuelView === 'plan' ? 'act-btn primary' : 'act-btn') + '" data-act="refuel-toggle" data-view="plan" style="margin:0; padding:10px;">MEAL PROTOCOL</button>' +
          '</div>' +

          (state.refuelView === 'plan' ? viewMealPlan() : (
            '<div class="date-nav" style="grid-template-columns: 1fr 1fr; gap: 6px;">' +
            '<button data-act="nut-prev" style="width:100%;">◀ PREV</button>' +
            '<button data-act="nut-next" style="width:100%;">NEXT ▶</button>' +
            "</div>" +

            '<div class="card">' +
            '<div class="kicker" style="margin-bottom:8px">DAILY PROTEIN PROGRESS · ' + esc(fmtDate(key)) + "</div>" +
            '<div class="ring-wrap">' +
            '<div class="ring-box">' +
            '<svg class="ring" viewBox="0 0 120 120">' +

      function renderMeasurementHistory(db) {
        const dates = Object.keys(db.measurements || {}).sort();
        if (dates.length === 0) return '<div class="dim" style="font-size:11px; padding:10px 0;">NO MEASUREMENTS LOGGED YET.</div>';

        const latestDate = dates[dates.length - 1];
        const prevDate = dates.length > 1 ? dates[dates.length - 2] : null;

        const latest = db.measurements[latestDate] || {};
        const prev = prevDate ? db.measurements[prevDate] : {};

        const fields = [
          { key: "chest", label: "Chest" },
          { key: "waist", label: "Waist" },
          { key: "arms", label: "Arms" },
          { key: "thighs", label: "Thighs" },
          { key: "calves", label: "Calves" },
          { key: "neck", label: "Neck" }
        ];

        let html = "";
        fields.forEach(f => {
          const val = num(latest[f.key], 0);
          if (val === 0) return; // Skip if not logged

          let deltaHTML = '<span class="delta-same">--</span>';
          if (prev[f.key]) {
            const diff = val - num(prev[f.key], 0);
            if (diff > 0) deltaHTML = '<span class="delta-up">+' + diff.toFixed(1) + '</span>';
            else if (diff < 0) deltaHTML = '<span class="delta-down">' + diff.toFixed(1) + '</span>';
            else deltaHTML = '<span class="delta-same">0.0</span>';
          }

          html += '<div class="measure-stat-row">' +
            '<span style="color:var(--muted)">' + f.label.toUpperCase() + '</span>' +
            '<span><b style="color:#fff">' + val + 'cm</b> ' + deltaHTML + '</span>' +
            '</div>';
        });

        if (!html) return '<div class="dim" style="font-size:11px; padding:10px 0;">NO DATA YET.</div>';
        return html;
      }

      /* ---------------------------------------------------------------------------
         REST TIMER
         --------------------------------------------------------------------------- */
      let wakeLock = null;
      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (err) { console.log(err); }
      }
      function releaseWakeLock() {
        if (wakeLock !== null) {
          wakeLock.release();
          wakeLock = null;
        }
      }
      /* ---------------------------------------------------------------------------
   REST TIMER (FULLSCREEN ANALOG)
   --------------------------------------------------------------------------- */
      const rest = { endAt: 0, total: 0, handle: null };

      // Wait for DOM to load to get these elements
      let timerProgress, timerContainer;
      const circumference = 2 * Math.PI * 90;

      function startRest(seconds) {
        if (!seconds || seconds <= 0) return;

        // Get elements here in case they weren't ready at boot
        if (!timerContainer) {
          timerContainer = document.getElementById("fullscreenTimer");
          timerProgress = document.getElementById("timerProgress");
        }

        if (typeof requestWakeLock === 'function') requestWakeLock();

        rest.total = seconds;
        rest.endAt = Date.now() + seconds * 1000;

        timerContainer.classList.add("show");
        timerProgress.style.strokeDasharray = circumference;
        timerProgress.style.strokeDashoffset = 0;

        // HIGHLIGHT THE ACTIVE PRESET BUTTON
        document.querySelectorAll('.rest-preset-btn').forEach(b => {
          b.classList.toggle('on', Number(b.dataset.s) === seconds);
        });

        tickRest();
        if (rest.handle) clearInterval(rest.handle);
        rest.handle = setInterval(tickRest, 100);
      }

      function tickRest() {
        const now = Date.now();
        const left = Math.max(0, Math.round((rest.endAt - now) / 1000));
        const m = Math.floor(left / 60);
        const s = left % 60;

        document.getElementById("fullscreenClock").textContent = m + ":" + pad2(s);

        const elapsed = rest.total - left;
        const percentage = elapsed / rest.total;
        if (timerProgress) timerProgress.style.strokeDashoffset = -(circumference * percentage);

        if (left <= 0) finishRest();
      }

      function finishRest() {
        if (rest.handle) { clearInterval(rest.handle); rest.handle = null; }
        if (typeof releaseWakeLock === 'function') releaseWakeLock();

        if (document.getElementById("fullscreenClock")) {
          document.getElementById("fullscreenClock").textContent = "GO";
        }
        if (timerProgress) timerProgress.style.strokeDashoffset = -circumference;

        if (navigator.vibrate) {
          try { navigator.vibrate([220, 110, 220, 110, 320]); } catch (e) { }
        }

        setTimeout(() => {
          if (timerContainer) timerContainer.classList.remove("show");
        }, 2500);
      }

      function stopRest() {
        if (rest.handle) { clearInterval(rest.handle); rest.handle = null; }
        if (typeof releaseWakeLock === 'function') releaseWakeLock();
        if (timerContainer) timerContainer.classList.remove("show");
      }

      /* ---------------------------------------------------------------------------
         IMAGE COMPRESSION
         --------------------------------------------------------------------------- */
      function compressImage(file, maxDim, quality) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = function () {
            try {
              let w = img.naturalWidth || img.width;
              let h = img.naturalHeight || img.height;
              const scale = Math.min(1, maxDim / Math.max(w, h));
              const cw = Math.max(1, Math.round(w * scale));
              const ch = Math.max(1, Math.round(h * scale));
              const canvas = document.createElement("canvas");
              canvas.width = cw;
              canvas.height = ch;
              const ctx = canvas.getContext("2d");
              ctx.fillStyle = "#0d1115";
              ctx.fillRect(0, 0, cw, ch);
              ctx.drawImage(img, 0, 0, cw, ch);
              URL.revokeObjectURL(url);
              resolve(canvas.toDataURL("image/jpeg", quality));
            } catch (err) {
              URL.revokeObjectURL(url);
              reject(err);
            }
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error("Image decode failed"));
          };
          img.src = url;
        });
      }
